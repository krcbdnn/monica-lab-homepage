user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # P15-T3: 응답 헤더/오류 페이지에 Nginx 버전을 노출하지 않는다.
    server_tokens off;

    # P15-T3: 관리자 로그인 rate limit(ARCHITECTURE.md "관리자 로그인 rate limit"). Nginx가 인터넷에 직접 노출된
    # 가장 바깥 proxy이므로 $binary_remote_addr가 실제 클라이언트 IP다(X-Forwarded-For로 조작 불가).
    # 초과 요청은 Spring에 전달하지 않고 Nginx가 429로 응답한다(본문은 ApiResponse JSON이 아니다).
    limit_req_zone $binary_remote_addr zone=admin_login:1m rate=5r/m;
    limit_req_status 429;

    # P15-T3: :80은 ACME HTTP-01 challenge(host certbot webroot)만 제공하고, 그 외 요청은 HTTPS로 301 redirect한다.
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # P15-T3: :443 TLS termination. 인증서는 도메인과 무관한 고정 경로(host ./data/certs → read-only mount)만 참조한다.
    # TLS protocol/cipher는 Nginx 기본값을 사용한다.
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 10m;

        # HSTS는 Nginx가 단독으로 담당한다(Spring Security HSTS는 비활성화, P15-T1). includeSubDomains/preload 없음.
        # Nginx는 location에 add_header가 하나라도 있으면 상위 add_header를 상속하지 않으므로, add_header를 쓰는
        # 정적 location에도 같은 HSTS를 다시 선언한다.
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /css/ {
            root /usr/share/nginx/html;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Static-Served-By nginx always;
            add_header Cache-Control "no-cache" always;
        }

        location /js/ {
            root /usr/share/nginx/html;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Static-Served-By nginx always;
            add_header Cache-Control "no-cache" always;
        }

        location /images/ {
            root /usr/share/nginx/html;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Static-Served-By nginx always;
            add_header Cache-Control "no-cache" always;
        }

        location /vendor/ {
            root /usr/share/nginx/html;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Static-Served-By nginx always;
            add_header Cache-Control "no-cache" always;
        }

        # 관리자 로그인만 rate limit 대상이다(정확히 일치하는 location). 그 외 관리자 API/화면은 제한하지 않는다.
        location = /api/admin/login {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://app:8080;
        }

        location / {
            proxy_pass http://app:8080;
        }
    }
}
