<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#popup-form-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>팝업 등록/수정</title>
</head>
<body>
<div id="popup-form-content" style="max-width: 800px;">
    <h3 class="mb-4">팝업 등록/수정</h3>
    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    <form id="popupForm">
        <input type="hidden" id="popupId" name="popupId">
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title" required maxlength="100">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="8"></textarea>
        </div>
        <div class="mb-3">
            <label for="startDate" class="form-label">시작일</label>
            <input type="datetime-local" class="form-control" id="startDate" name="startDate" required>
        </div>
        <div class="mb-3">
            <label for="endDate" class="form-label">종료일</label>
            <input type="datetime-local" class="form-control" id="endDate" name="endDate" required>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="isVisible" name="isVisible">
            <label for="isVisible" class="form-check-label">노출</label>
        </div>
        <button type="submit" class="btn btn-primary">저장</button>
    </form>
</div>

<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="/js/admin/common-fetch.js"></script>
<script src="/js/admin/ckeditor-upload-adapter.js"></script>
<script>
    var contentEditor = null;
    var errorMessage = document.querySelector('#errorMessage');

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
    }

    var editorReady = ClassicEditor.create(document.querySelector('#content'))
        .then(function (editor) {
            contentEditor = editor;
            AdminCkeditorUploadAdapter.installUploadAdapterPlugin(editor, AdminFetch.adminFetch);
            return editor;
        })
        .catch(function (error) {
            console.error(error);
        });

    function extractPopupIdFromPath() {
        var match = window.location.pathname.match(/^\/admin\/popups\/(\d+)\/edit$/);
        return match ? match[1] : null;
    }

    var editingPopupId = extractPopupIdFromPath();

    if (editingPopupId) {
        document.querySelector('#popupId').value = editingPopupId;

        Promise.all([
            AdminFetch.adminFetch('/api/admin/popups/' + editingPopupId)
                .then(function (response) {
                    return response.json();
                }),
            editorReady
        ]).then(function (results) {
            var body = results[0];
            var editor = results[1];
            var popup = body.data;

            document.querySelector('#title').value = popup.title;
            if (editor) {
                editor.setData(popup.content || '');
            }
            document.querySelector('#startDate').value = popup.startDate ? popup.startDate.slice(0, 16) : '';
            document.querySelector('#endDate').value = popup.endDate ? popup.endDate.slice(0, 16) : '';
            document.querySelector('#isVisible').checked = popup.isVisible;
        });
    }

    document.querySelector('#popupForm').addEventListener('submit', function (event) {
        event.preventDefault();

        errorMessage.style.display = 'none';

        var popupId = document.querySelector('#popupId').value;
        var payload = {
            title: document.querySelector('#title').value,
            content: contentEditor ? contentEditor.getData() : document.querySelector('#content').value,
            startDate: document.querySelector('#startDate').value,
            endDate: document.querySelector('#endDate').value,
            isVisible: document.querySelector('#isVisible').checked
        };

        var url = popupId ? '/api/admin/popups/' + popupId : '/api/admin/popups';
        var method = popupId ? 'PUT' : 'POST';

        AdminFetch.adminFetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
            .then(function (response) {
                return response.json().then(function (body) {
                    return {ok: response.ok, body: body};
                });
            })
            .then(function (result) {
                if (result.ok && result.body.success) {
                    window.location.href = '/admin/popups';
                } else {
                    showError((result.body.error && result.body.error.message)
                        || '저장 중 오류가 발생했습니다.');
                }
            })
            .catch(function () {
                showError('저장 중 오류가 발생했습니다.');
            });
    });
</script>
</body>
</html>
