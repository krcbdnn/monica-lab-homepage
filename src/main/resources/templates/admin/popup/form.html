<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팝업 등록/수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 800px; margin-top: 40px;">
    <h3 class="mb-4">팝업 등록/수정</h3>
    <form id="popupForm">
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title" required maxlength="100">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea id="content" name="content"></textarea>
        </div>
    </form>
</div>

<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="/js/admin/common-fetch.js"></script>
<script src="/js/admin/ckeditor-upload-adapter.js"></script>
<script>
    ClassicEditor.create(document.querySelector('#content'))
        .then(function (editor) {
            AdminCkeditorUploadAdapter.installUploadAdapterPlugin(editor, AdminFetch.adminFetch);
        })
        .catch(function (error) {
            console.error(error);
        });
</script>
</body>
</html>
