<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#popup-list-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>팝업 관리</title>
</head>
<body>
<div id="popup-list-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>팝업 관리</h2>
        <a href="/admin/popups/new" class="btn btn-primary">새 팝업 등록</a>
    </div>

    <!-- P14-T9C-1: 삭제/전환 결과 inline status(AdminDisplay.showStatus/clearStatus). -->
    <div id="admin-list-status" hidden></div>

    <!-- P14-T9C-1: 좁은 화면에서 페이지 전체가 아니라 이 wrapper 안에서만 가로 스크롤된다. -->
    <div class="table-responsive">
    <table class="table">
        <thead>
        <tr>
            <th scope="col">제목</th>
            <th scope="col">시작일</th>
            <th scope="col">종료일</th>
            <th scope="col">노출 여부</th>
            <th scope="col">관리</th>
        </tr>
        </thead>
        <tbody id="popup-list-body"></tbody>
    </table>
    </div>

    <script>
        var listStatus = document.getElementById('admin-list-status');
        var COLUMN_COUNT = 5;
        var STATUS_CHANGE_ERROR = '상태 변경 중 오류가 발생했습니다.';
        var DELETE_ERROR = '삭제 중 오류가 발생했습니다.';

        // P14-T9C-1: 실패 응답의 body가 JSON이 아니어도(세션 만료 HTML 등) fallback 문구로 표시한다.
        function showResponseError(response, fallback) {
            return response.json()
                .catch(function () {
                    return null;
                })
                .then(function (body) {
                    AdminDisplay.showStatus(listStatus, AdminDisplay.apiErrorMessage(body, fallback), 'error');
                });
        }

        // 전환 성공은 다시 그려진 badge 자체가 결과이므로 별도 성공 메시지 없이 목록만 다시 불러온다.
        function reloadOrShowError(response, fallback) {
            if (response.ok) {
                loadPopups();
                return undefined;
            }
            return showResponseError(response, fallback);
        }

        function renderRow(popup) {
            var tr = document.createElement('tr');

            var titleTd = document.createElement('td');
            titleTd.textContent = popup.title;
            tr.appendChild(titleTd);

            var startDateTd = document.createElement('td');
            startDateTd.textContent = popup.startDate;
            tr.appendChild(startDateTd);

            var endDateTd = document.createElement('td');
            endDateTd.textContent = popup.endDate;
            tr.appendChild(endDateTd);

            var visibleTd = document.createElement('td');
            visibleTd.appendChild(AdminDisplay.createStateBadge(document, popup.isVisible, '노출', '비노출'));
            tr.appendChild(visibleTd);

            var actionTd = document.createElement('td');

            var editLink = document.createElement('a');
            editLink.href = '/admin/popups/' + popup.id + '/edit';
            editLink.className = 'btn btn-sm btn-outline-secondary me-1';
            editLink.textContent = '수정';
            actionTd.appendChild(editLink);

            var visibilityButton = document.createElement('button');
            visibilityButton.type = 'button';
            visibilityButton.className = 'btn btn-sm btn-outline-secondary me-1';
            visibilityButton.textContent = popup.isVisible ? '비노출로 전환' : '노출로 전환';
            visibilityButton.addEventListener('click', function () {
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/popups/' + popup.id + '/visibility', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({isVisible: !popup.isVisible})
                })
                    .then(function (response) {
                        return reloadOrShowError(response, STATUS_CHANGE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, STATUS_CHANGE_ERROR, 'error');
                    });
            });
            actionTd.appendChild(visibilityButton);

            var deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'btn btn-sm btn-outline-danger';
            deleteButton.textContent = '삭제';
            deleteButton.addEventListener('click', function () {
                if (!window.confirm('삭제하시겠습니까?')) {
                    return;
                }
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/popups/' + popup.id, {method: 'DELETE'})
                    .then(function (response) {
                        if (response.ok) {
                            // loadPopups()는 status를 건드리지 않으므로 성공 메시지는 재조회(실패 포함) 후에도 남는다.
                            loadPopups();
                            AdminDisplay.showStatus(listStatus, '삭제되었습니다.', 'success');
                            return undefined;
                        }
                        return showResponseError(response, DELETE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, DELETE_ERROR, 'error');
                    });
            });
            actionTd.appendChild(deleteButton);

            tr.appendChild(actionTd);
            return tr;
        }

        // P14-T9C-1: 이 함수는 inline status를 바꾸지 않는다(tbody만 담당). 응답 실패/JSON 파싱 실패/렌더링 예외
        // 모두 이전 행을 지우고 오류 행 하나만 남긴다.
        function loadPopups() {
            var tbody = document.getElementById('popup-list-body');
            AdminFetch.adminFetch('/api/admin/popups')
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.json();
                })
                .then(function (body) {
                    var popups = body.data;
                    tbody.innerHTML = '';
                    popups.forEach(function (popup) {
                        tbody.appendChild(renderRow(popup));
                    });
                    if (popups.length === 0) {
                        AdminDisplay.renderEmptyRow(document, tbody, COLUMN_COUNT, '등록된 팝업이 없습니다.');
                    }
                })
                .catch(function () {
                    AdminDisplay.renderErrorRow(document, tbody, COLUMN_COUNT, '팝업 목록을 불러오지 못했습니다.');
                });
        }

        loadPopups();
    </script>
</div>
</body>
</html>
