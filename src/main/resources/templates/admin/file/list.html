<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#file-list-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>파일 관리</title>
</head>
<body>
<div id="file-list-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>파일 관리</h2>
    </div>

    <!-- P14-T9C-1: 삭제 결과 inline status(AdminDisplay.showStatus/clearStatus). 기존 목록 전용 #errorMessage를 대체한다. -->
    <div id="admin-list-status" hidden></div>

    <!-- P14-T9C-1: 좁은 화면에서 페이지 전체가 아니라 이 wrapper 안에서만 가로 스크롤된다. -->
    <div class="table-responsive">
    <table class="table">
        <thead>
        <tr>
            <th scope="col">파일명</th>
            <th scope="col">유형</th>
            <th scope="col">콘텐츠 타입</th>
            <th scope="col">크기</th>
            <th scope="col">업로드일</th>
            <th scope="col">관리</th>
        </tr>
        </thead>
        <tbody id="file-list-body"></tbody>
    </table>
    </div>

    <nav id="pagination" class="d-flex gap-2" aria-label="페이지 이동">
        <button id="prev-page" type="button" class="btn btn-outline-secondary" disabled>이전</button>
        <button id="next-page" type="button" class="btn btn-outline-secondary" disabled>다음</button>
    </nav>

    <script>
        var listStatus = document.getElementById('admin-list-status');
        var state = {page: 0, size: 20};
        var COLUMN_COUNT = 6;
        var DELETE_ERROR = '삭제 중 오류가 발생했습니다.';

        // P14-T9C-1: 실패 응답의 body가 JSON이 아니어도(세션 만료 HTML 등) fallback 문구로 표시한다.
        function showResponseError(response, fallback) {
            return response.json()
                .catch(function () {
                    return null;
                })
                .then(function (body) {
                    AdminDisplay.showStatus(listStatus, AdminDisplay.apiErrorMessage(body, fallback), 'error');
                });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) {
                return bytes + ' B';
            }
            if (bytes < 1024 * 1024) {
                return (bytes / 1024).toFixed(1) + ' KB';
            }
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function buildQuery() {
            var params = new URLSearchParams();
            params.set('page', state.page);
            params.set('size', state.size);
            return params.toString();
        }

        function renderRow(file) {
            var tr = document.createElement('tr');

            var nameTd = document.createElement('td');
            var nameLink = document.createElement('a');
            nameLink.href = file.url;
            nameLink.target = '_blank';
            nameLink.rel = 'noopener noreferrer';
            nameLink.textContent = file.originalName;
            nameTd.appendChild(nameLink);
            tr.appendChild(nameTd);

            // P14-T9C-1: 유형은 관리자 공통 표시명(이미지/첨부파일)의 neutral badge. MIME/날짜는 원래 값 그대로다.
            var typeTd = document.createElement('td');
            typeTd.appendChild(AdminDisplay.createBadge(document,
                AdminDisplay.label(AdminDisplay.FILE_TYPE_LABELS, file.fileType), 'neutral'));
            tr.appendChild(typeTd);

            var contentTypeTd = document.createElement('td');
            contentTypeTd.textContent = file.contentType;
            tr.appendChild(contentTypeTd);

            var sizeTd = document.createElement('td');
            sizeTd.textContent = formatFileSize(file.size);
            tr.appendChild(sizeTd);

            var createdAtTd = document.createElement('td');
            createdAtTd.textContent = file.createdAt;
            tr.appendChild(createdAtTd);

            var actionTd = document.createElement('td');

            var deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'btn btn-sm btn-outline-danger';
            deleteButton.textContent = '삭제';
            deleteButton.addEventListener('click', function () {
                if (!window.confirm('삭제하시겠습니까?')) {
                    return;
                }
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/files/' + file.id, {method: 'DELETE'})
                    .then(function (response) {
                        if (response.ok) {
                            loadFiles();
                            // loadFiles()는 status를 건드리지 않으므로 성공 메시지는 재조회(실패 포함) 후에도 남는다.
                            AdminDisplay.showStatus(listStatus, '삭제되었습니다.', 'success');
                            return undefined;
                        }
                        return showResponseError(response, DELETE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, DELETE_ERROR, 'error');
                    });
            });
            actionTd.appendChild(deleteButton);

            tr.appendChild(actionTd);
            return tr;
        }

        // P14-T9C-1: 이 함수는 inline status를 바꾸지 않는다(tbody/pagination만 담당). 응답 실패/JSON 파싱 실패/
        // 렌더링 예외 모두 이전 행을 지우고 오류 행 하나만 남긴다.
        function loadFiles() {
            var tbody = document.getElementById('file-list-body');
            AdminFetch.adminFetch('/api/admin/files?' + buildQuery())
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.json();
                })
                .then(function (body) {
                    var data = body.data;
                    tbody.innerHTML = '';
                    data.content.forEach(function (file) {
                        tbody.appendChild(renderRow(file));
                    });
                    if (data.content.length === 0) {
                        AdminDisplay.renderEmptyRow(document, tbody, COLUMN_COUNT, '등록된 파일이 없습니다.');
                    }

                    document.getElementById('prev-page').disabled = data.page <= 0;
                    document.getElementById('next-page').disabled = data.last;
                })
                .catch(function () {
                    AdminDisplay.renderErrorRow(document, tbody, COLUMN_COUNT, '파일 목록을 불러오지 못했습니다.');
                    document.getElementById('next-page').disabled = true;
                });
        }

        document.getElementById('prev-page').addEventListener('click', function () {
            if (state.page > 0) {
                state.page -= 1;
                loadFiles();
            }
        });

        document.getElementById('next-page').addEventListener('click', function () {
            state.page += 1;
            loadFiles();
        });

        loadFiles();
    </script>
</div>
</body>
</html>
