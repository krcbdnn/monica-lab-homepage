<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#menu-form-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>메뉴 등록/수정</title>
</head>
<body>
<div id="menu-form-content" style="max-width: 800px;">
    <h3 class="mb-4">메뉴 등록/수정</h3>
    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    <form id="menuForm">
        <input type="hidden" id="menuId" name="menuId">
        <div class="mb-3">
            <label for="label" class="form-label">메뉴명</label>
            <input type="text" class="form-control" id="label" name="label" required maxlength="50">
        </div>
        <div class="mb-3">
            <label for="parentId" class="form-label">상위 메뉴</label>
            <select class="form-select" id="parentId" name="parentId">
                <option value="">없음(최상위)</option>
            </select>
            <div class="form-text">상위 메뉴로 선택할 수 있는 것은 유형이 "GROUP"인 최상위 메뉴뿐입니다.</div>
        </div>
        <div class="mb-3">
            <label for="targetType" class="form-label">유형</label>
            <select class="form-select" id="targetType" name="targetType">
                <option value="GROUP">GROUP(하위 메뉴 묶음, 자체 링크 없음)</option>
                <option value="HOME">HOME(메인 화면)</option>
                <option value="PAGE">PAGE(기관소개 고정 페이지)</option>
                <option value="PROGRAM_LIST">PROGRAM_LIST(프로그램 목록)</option>
                <option value="BOARD_LIST">BOARD_LIST(게시판 목록)</option>
                <option value="INTERNAL_URL">INTERNAL_URL(내부 경로)</option>
                <option value="EXTERNAL_URL">EXTERNAL_URL(외부 URL)</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="targetValue" class="form-label">대상 값</label>
            <input type="text" class="form-control" id="targetValue" name="targetValue" maxlength="255">
            <div class="form-text">
                GROUP/HOME은 비워둡니다. PAGE는 GREETING/INTRODUCTION/HISTORY/LOCATION 중 하나,
                PROGRAM_LIST는 COURSE/SPECIAL(비우면 전체), BOARD_LIST는 NOTICE/GALLERY/ARCHIVE/REVIEW(비우면 전체),
                INTERNAL_URL은 "/"로 시작하는 내부 경로, EXTERNAL_URL은 http(s):// URL을 입력합니다.
            </div>
        </div>
        <!-- P13-T30D(Task C): 유형이 BOARD_LIST이고 대상 값이 REVIEW일 때만 노출되는 조건부 select.
             UI에서만 조건부로 보여주는 것과 별개로 서버(MenuService.validateTarget)가 항상 다시
             검증하므로, 이 필드를 우회해 다른 조합으로 targetSubvalue를 보내도 400으로 거부된다. -->
        <div class="mb-3" id="targetSubvalueField" hidden>
            <label for="targetSubvalue" class="form-label">후기 대상(강의 후기 세부 구분)</label>
            <select class="form-select" id="targetSubvalue" name="targetSubvalue">
                <option value="">미지정(기존 REVIEW 전체 호환)</option>
                <option value="COURSE">수강 후기(COURSE)</option>
                <option value="SPECIAL">특강 후기(SPECIAL)</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="sortOrder" class="form-label">정렬 순서</label>
            <input type="number" class="form-control" id="sortOrder" name="sortOrder" min="0" required>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="visible" name="visible">
            <label for="visible" class="form-check-label">노출</label>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="openInNewTab" name="openInNewTab">
            <label for="openInNewTab" class="form-check-label">새 탭에서 열기</label>
        </div>
        <button type="submit" class="btn btn-primary">저장</button>
    </form>

<script src="/js/admin/common-fetch.js"></script>
<script>
    var errorMessage = document.querySelector('#errorMessage');

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
    }

    function extractMenuIdFromPath() {
        var match = window.location.pathname.match(/^\/admin\/menus\/(\d+)\/edit$/);
        return match ? match[1] : null;
    }

    var editingMenuId = extractMenuIdFromPath();

    // P13-T30A: 상위 메뉴로 선택할 수 있는 것은 유형이 GROUP인 최상위 메뉴뿐이다(자기 자신 제외).
    // 실제 강제는 서버(MenuService)가 하지만, 화면에서도 애초에 고를 수 없는 후보는 보여주지 않는다.
    function loadParentOptions() {
        return AdminFetch.adminFetch('/api/admin/menus')
            .then(function (response) {
                return response.json();
            })
            .then(function (body) {
                var select = document.querySelector('#parentId');
                body.data
                    .filter(function (menu) {
                        return menu.targetType === 'GROUP' && !menu.parentId
                            && String(menu.id) !== String(editingMenuId);
                    })
                    .forEach(function (menu) {
                        var option = document.createElement('option');
                        option.value = menu.id;
                        option.textContent = menu.label;
                        select.appendChild(option);
                    });
            });
    }

    var parentOptionsReady = loadParentOptions();

    // P13-T30D(Task C): targetType=BOARD_LIST이고 targetValue=REVIEW일 때만 targetSubvalue 선택
    // UI를 노출한다. 그 외 조합으로 바뀌면 필드를 숨기고 값도 비워(payload에서 항상 null로 나가도록)
    // 서버에 stale targetSubvalue가 실려 가지 않게 한다.
    function updateTargetSubvalueVisibility() {
        var isBoardReview = document.querySelector('#targetType').value === 'BOARD_LIST'
            && document.querySelector('#targetValue').value === 'REVIEW';
        document.querySelector('#targetSubvalueField').hidden = !isBoardReview;
        if (!isBoardReview) {
            document.querySelector('#targetSubvalue').value = '';
        }
    }
    document.querySelector('#targetType').addEventListener('change', updateTargetSubvalueVisibility);
    document.querySelector('#targetValue').addEventListener('input', updateTargetSubvalueVisibility);
    updateTargetSubvalueVisibility();

    if (editingMenuId) {
        document.querySelector('#menuId').value = editingMenuId;

        Promise.all([
            AdminFetch.adminFetch('/api/admin/menus/' + editingMenuId)
                .then(function (response) {
                    return response.json();
                }),
            parentOptionsReady
        ]).then(function (results) {
            var menu = results[0].data;

            document.querySelector('#label').value = menu.label;
            document.querySelector('#parentId').value = menu.parentId || '';
            document.querySelector('#targetType').value = menu.targetType;
            document.querySelector('#targetValue').value = menu.targetValue || '';
            document.querySelector('#targetSubvalue').value = menu.targetSubvalue || '';
            updateTargetSubvalueVisibility();
            document.querySelector('#sortOrder').value = menu.sortOrder;
            document.querySelector('#visible').checked = menu.visible;
            document.querySelector('#openInNewTab').checked = menu.openInNewTab;
        });
    }

    document.querySelector('#menuForm').addEventListener('submit', function (event) {
        event.preventDefault();

        errorMessage.style.display = 'none';

        var menuId = document.querySelector('#menuId').value;
        var parentIdValue = document.querySelector('#parentId').value;
        var targetTypeValue = document.querySelector('#targetType').value;
        var targetValueValue = document.querySelector('#targetValue').value || null;
        var isBoardReview = targetTypeValue === 'BOARD_LIST' && targetValueValue === 'REVIEW';
        var payload = {
            label: document.querySelector('#label').value,
            parentId: parentIdValue ? Number(parentIdValue) : null,
            targetType: targetTypeValue,
            targetValue: targetValueValue,
            // BOARD_LIST+REVIEW가 아니면 select에 남아있는 값과 무관하게 항상 null로 정규화해 전송한다.
            targetSubvalue: isBoardReview ? (document.querySelector('#targetSubvalue').value || null) : null,
            sortOrder: Number(document.querySelector('#sortOrder').value),
            visible: document.querySelector('#visible').checked,
            openInNewTab: document.querySelector('#openInNewTab').checked
        };

        var url = menuId ? '/api/admin/menus/' + menuId : '/api/admin/menus';
        var method = menuId ? 'PUT' : 'POST';

        AdminFetch.adminFetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
            .then(function (response) {
                return response.json().then(function (body) {
                    return {ok: response.ok, body: body};
                });
            })
            .then(function (result) {
                if (result.ok && result.body.success) {
                    window.location.href = '/admin/menus';
                } else {
                    showError((result.body.error && result.body.error.message)
                        || '저장 중 오류가 발생했습니다.');
                }
            })
            .catch(function () {
                showError('저장 중 오류가 발생했습니다.');
            });
    });
</script>
</div>
</body>
</html>
