<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#program-list-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>프로그램 관리</title>
</head>
<body>
<div id="program-list-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>프로그램 관리</h2>
        <a href="/admin/programs/new" class="btn btn-primary">새 프로그램 등록</a>
    </div>

    <form id="searchForm" class="row g-2 mb-4">
        <div class="col-auto">
            <select id="searchProgramType" class="form-select">
                <option value="">전체</option>
                <option value="COURSE">정규 강좌</option>
                <option value="SPECIAL">특강</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="text" id="searchKeyword" class="form-control" placeholder="검색어">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">검색</button>
        </div>
    </form>

    <!-- P14-T9C-1: 삭제/전환 결과 inline status(AdminDisplay.showStatus/clearStatus). -->
    <div id="admin-list-status" hidden></div>

    <!-- P14-T9A: table 자체(columns/데이터/action)는 무변경 - 좁은 화면에서 페이지 전체가 아니라
         이 wrapper 안에서만 가로 스크롤되도록 Bootstrap 기본 유틸리티만 추가한다. -->
    <div class="table-responsive">
    <table class="table">
        <thead>
        <tr>
            <th scope="col">제목</th>
            <th scope="col">구분</th>
            <th scope="col">모집 상태</th>
            <th scope="col">공개 여부</th>
            <th scope="col">관리</th>
        </tr>
        </thead>
        <tbody id="program-list-body"></tbody>
    </table>
    </div>

    <nav id="pagination" class="d-flex gap-2" aria-label="페이지 이동">
        <button id="prev-page" type="button" class="btn btn-outline-secondary" disabled>이전</button>
        <button id="next-page" type="button" class="btn btn-outline-secondary" disabled>다음</button>
    </nav>

    <script src="/js/admin/admin-list-state.js"></script>
    <script>
        var state = {page: 0, size: 20, programType: '', keyword: ''};
        var listStatus = document.getElementById('admin-list-status');
        var COLUMN_COUNT = 5;
        // P14-T9C-2: 가장 최근 loadPrograms() 요청 번호. 늦게 도착한 이전 응답이 최신 state/URL/DOM을 덮지 못하게 한다.
        var loadSeq = 0;

        // P14-T9C-2: URL query(programType/keyword/page, 0-based)가 목록 state의 canonical 표현이다. 진입 시 한 번
        // allowlist 검증을 거쳐 state와 검색 UI를 복원하고, 이후 URL 반영(replaceState)은 loadPrograms()가 맡는다.
        var initialState = AdminListState.readState(AdminListState.PROGRAM_LIST, window.location.search);
        state.programType = initialState.programType;
        state.keyword = initialState.keyword;
        state.page = initialState.page;
        document.getElementById('searchProgramType').value = state.programType;
        document.getElementById('searchKeyword').value = state.keyword;
        var STATUS_CHANGE_ERROR = '상태 변경 중 오류가 발생했습니다.';
        var DELETE_ERROR = '삭제 중 오류가 발생했습니다.';

        function buildQuery() {
            var params = new URLSearchParams();
            params.set('page', state.page);
            params.set('size', state.size);
            if (state.programType) {
                params.set('programType', state.programType);
            }
            if (state.keyword) {
                params.set('keyword', state.keyword);
            }
            return params.toString();
        }

        // P14-T9C-1: 실패 응답의 body가 JSON이 아니어도(세션 만료 HTML 등) fallback 문구로 표시한다.
        function showResponseError(response, fallback) {
            return response.json()
                .catch(function () {
                    return null;
                })
                .then(function (body) {
                    AdminDisplay.showStatus(listStatus, AdminDisplay.apiErrorMessage(body, fallback), 'error');
                });
        }

        // 전환 성공은 다시 그려진 badge 자체가 결과이므로 별도 성공 메시지 없이 목록만 다시 불러온다.
        function reloadOrShowError(response, fallback) {
            if (response.ok) {
                loadPrograms();
                return undefined;
            }
            return showResponseError(response, fallback);
        }

        function emptyMessage() {
            return state.programType || state.keyword ? '조건에 맞는 프로그램이 없습니다.' : '등록된 프로그램이 없습니다.';
        }

        function renderRow(program) {
            var tr = document.createElement('tr');

            // P14-T10: 제목을 읽기 전용 관리자 상세로 연결한다(링크 텍스트는 계속 textContent로 escape 유지).
            // P14-T9C-2: 상세 URL에 현재 목록 state(allowlist된 canonical query)를 실어 "목록으로"가 이 상태로 돌아오게 한다.
            var titleTd = document.createElement('td');
            var titleLink = document.createElement('a');
            titleLink.href = AdminListState.detailHref(AdminListState.PROGRAM_LIST, program.id, state);
            titleLink.textContent = program.title;
            titleTd.appendChild(titleLink);
            tr.appendChild(titleTd);

            // P14-T9C-1: 유형은 neutral, 모집 상태는 모집중(positive)/마감(muted), 공개 여부는 state badge.
            var typeTd = document.createElement('td');
            typeTd.appendChild(AdminDisplay.createBadge(document,
                AdminDisplay.label(AdminDisplay.PROGRAM_TYPE_LABELS, program.programType), 'neutral'));
            tr.appendChild(typeTd);

            var statusTd = document.createElement('td');
            statusTd.appendChild(AdminDisplay.createBadge(document,
                AdminDisplay.label(AdminDisplay.RECRUIT_STATUS_LABELS, program.recruitStatus),
                AdminDisplay.recruitStatusTone(program.recruitStatus)));
            tr.appendChild(statusTd);

            var publicTd = document.createElement('td');
            publicTd.appendChild(AdminDisplay.createStateBadge(document, program.isPublic, '공개', '비공개'));
            tr.appendChild(publicTd);

            var actionTd = document.createElement('td');

            var editLink = document.createElement('a');
            editLink.href = '/admin/programs/' + program.id + '/edit';
            editLink.className = 'btn btn-sm btn-outline-secondary me-1';
            editLink.textContent = '수정';
            actionTd.appendChild(editLink);

            var visibilityButton = document.createElement('button');
            visibilityButton.type = 'button';
            visibilityButton.className = 'btn btn-sm btn-outline-secondary me-1';
            visibilityButton.textContent = program.isPublic ? '비공개로 전환' : '공개로 전환';
            visibilityButton.addEventListener('click', function () {
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/programs/' + program.id + '/visibility', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({isPublic: !program.isPublic})
                })
                    .then(function (response) {
                        return reloadOrShowError(response, STATUS_CHANGE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, STATUS_CHANGE_ERROR, 'error');
                    });
            });
            actionTd.appendChild(visibilityButton);

            var statusButton = document.createElement('button');
            statusButton.type = 'button';
            statusButton.className = 'btn btn-sm btn-outline-secondary me-1';
            var nextStatus = program.recruitStatus === 'OPEN' ? 'CLOSED' : 'OPEN';
            statusButton.textContent = nextStatus === 'CLOSED' ? '마감으로 전환' : '모집중으로 전환';
            statusButton.addEventListener('click', function () {
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/programs/' + program.id + '/status', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({recruitStatus: nextStatus})
                })
                    .then(function (response) {
                        return reloadOrShowError(response, STATUS_CHANGE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, STATUS_CHANGE_ERROR, 'error');
                    });
            });
            actionTd.appendChild(statusButton);

            var deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'btn btn-sm btn-outline-danger';
            deleteButton.textContent = '삭제';
            deleteButton.addEventListener('click', function () {
                if (!window.confirm('삭제하시겠습니까?')) {
                    return;
                }
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/programs/' + program.id, {method: 'DELETE'})
                    .then(function (response) {
                        if (response.ok) {
                            // loadPrograms()는 status를 건드리지 않으므로 성공 메시지는 재조회(실패 포함) 후에도 남는다.
                            loadPrograms();
                            AdminDisplay.showStatus(listStatus, '삭제되었습니다.', 'success');
                            return undefined;
                        }
                        return showResponseError(response, DELETE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, DELETE_ERROR, 'error');
                    });
            });
            actionTd.appendChild(deleteButton);

            tr.appendChild(actionTd);
            return tr;
        }

        // P14-T9C-1: 이 함수는 inline status를 바꾸지 않는다(tbody/pagination만 담당). 응답 실패/JSON 파싱 실패/
        // 렌더링 예외 모두 이전 행을 지우고 오류 행 하나만 남긴다.
        // P14-T9C-2: 요청 직전에 URL을 요청 state로 맞추고(replaceState, 재조회 없음), 정상 응답이면
        // AdminListState.resolvePage로 범위 밖 page(데이터 있음 → 마지막 유효 page로 1회 재조회)와 전체 0건(page 0으로
        // 정규화, 재조회 없음)을 처리한다. 조회 실패는 page를 바꾸지 않고 T9C-1 오류 행만 표시한다. fallbackDone은
        // 이미 1회 fallback한 재조회임을 뜻한다(무한 재조회 방지).
        function loadPrograms(fallbackDone) {
            var tbody = document.getElementById('program-list-body');
            var seq = ++loadSeq;
            var requestedPage = state.page;
            AdminListState.replaceUrl(window, AdminListState.PROGRAM_LIST, state);
            AdminFetch.adminFetch('/api/admin/programs?' + buildQuery())
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.json();
                })
                .then(function (body) {
                    if (seq !== loadSeq) {
                        return;
                    }
                    var data = body.data;
                    var resolved = AdminListState.resolvePage(requestedPage, data, !fallbackDone);
                    state.page = resolved.page;
                    if (resolved.reload) {
                        loadPrograms(true);
                        return;
                    }
                    AdminListState.replaceUrl(window, AdminListState.PROGRAM_LIST, state);

                    tbody.innerHTML = '';
                    data.content.forEach(function (program) {
                        tbody.appendChild(renderRow(program));
                    });
                    if (data.content.length === 0) {
                        AdminDisplay.renderEmptyRow(document, tbody, COLUMN_COUNT, emptyMessage());
                    }

                    document.getElementById('prev-page').disabled = state.page <= 0;
                    document.getElementById('next-page').disabled = data.last;
                })
                .catch(function () {
                    if (seq !== loadSeq) {
                        return;
                    }
                    AdminDisplay.renderErrorRow(document, tbody, COLUMN_COUNT, '프로그램 목록을 불러오지 못했습니다.');
                    document.getElementById('next-page').disabled = true;
                });
        }

        document.getElementById('searchForm').addEventListener('submit', function (event) {
            event.preventDefault();
            state.page = 0;
            state.programType = document.getElementById('searchProgramType').value;
            state.keyword = document.getElementById('searchKeyword').value;
            loadPrograms();
        });

        // P13-T31: programType select는 검색 버튼을 누르지 않아도 변경 즉시 재조회한다. keyword는
        // 여기서 다시 읽지 않는다 - 검색어 자체의 실행(state.keyword 갱신)은 여전히 검색 버튼(위
        // submit 핸들러)을 통해서만 커밋된다. 그래서 검색창에 아직 확정하지 않은 글자가 남아 있어도
        // select만 바꾸면 마지막으로 "검색"을 눌렀을 때의 keyword를 그대로 유지한 채 programType만
        // 갈아끼워 재조회한다(의도된 동작).
        document.getElementById('searchProgramType').addEventListener('change', function () {
            state.page = 0;
            state.programType = document.getElementById('searchProgramType').value;
            loadPrograms();
        });

        document.getElementById('prev-page').addEventListener('click', function () {
            if (state.page > 0) {
                state.page -= 1;
                loadPrograms();
            }
        });

        document.getElementById('next-page').addEventListener('click', function () {
            state.page += 1;
            loadPrograms();
        });

        loadPrograms();
    </script>
</div>
</body>
</html>
