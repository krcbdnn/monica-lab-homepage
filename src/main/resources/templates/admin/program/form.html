<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#program-form-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>프로그램 등록/수정</title>
</head>
<body>
<!-- P14-T9D: 공통 form composition(.admin-form 800px, 등록/수정 heading, 필수 표시, role=alert 오류, [취소][저장])과
     긴 form용 fieldset section(기본 정보/본문/파일/신청·모집/공개 설정). field DOM 순서와 CKEditor mount 구조는 그대로다. -->
<div id="program-form-content" class="admin-form">
    <h3 id="admin-form-heading" class="mb-2">프로그램 등록</h3>
    <p class="admin-form-required-note">* 표시는 필수 입력입니다.</p>
    <div id="errorMessage" class="alert alert-danger" role="alert" tabindex="-1" style="display: none;"></div>
    <form id="programForm">
        <input type="hidden" id="programId" name="programId">
        <fieldset class="mb-4">
        <legend class="h5">기본 정보</legend>
        <div class="mb-3">
            <label for="programType" class="form-label">프로그램 구분<span class="admin-required" aria-hidden="true">*</span></label>
            <select class="form-select" id="programType" name="programType" required>
                <option value="COURSE">정규 강좌</option>
                <option value="SPECIAL">특강</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="title" class="form-label">제목<span class="admin-required" aria-hidden="true">*</span></label>
            <input type="text" class="form-control" id="title" name="title" required maxlength="200">
        </div>
        </fieldset>
        <fieldset class="mb-4">
        <legend class="h5">본문</legend>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="8"></textarea>
            <!-- P13-T40: CKEditor 네이티브 balloon toolbar가 아니라 admin 폼 자체의 일반 버튼으로
                 이미지 크기를 조절한다(41.4.2 predefined build 유지, 공식 ImageResize 미사용). -->
            <div id="content-resize-controls" class="mt-2" hidden>
                <span class="form-text me-2">이미지 크기</span>
                <div class="btn-group btn-group-sm" role="group" aria-label="이미지 크기 조절">
                    <button type="button" class="btn btn-outline-secondary" data-resize-value="25">25%</button>
                    <button type="button" class="btn btn-outline-secondary" data-resize-value="50">50%</button>
                    <button type="button" class="btn btn-outline-secondary" data-resize-value="75">75%</button>
                    <button type="button" class="btn btn-outline-secondary" data-resize-value="">원본</button>
                </div>
            </div>
        </div>
        </fieldset>
        <fieldset class="mb-4">
        <legend class="h5">파일</legend>
        <div class="mb-3">
            <label for="thumbnailInput" class="form-label">대표 이미지</label>
            <div id="thumbnailPreview" class="mb-2" hidden>
                <img id="thumbnailPreviewImage" class="admin-file-preview__thumb" src="" alt="현재 등록된 대표 이미지">
                <div>
                    <a id="thumbnailPreviewLink" href="#" target="_blank" rel="noopener noreferrer">새 창에서 보기</a>
                    <button type="button" id="thumbnailRemoveButton" class="btn btn-outline-secondary btn-sm">제거</button>
                </div>
            </div>
            <input type="file" class="form-control" id="thumbnailInput" accept="image/*">
            <input type="hidden" id="thumbnail" name="thumbnail">
            <div class="form-text">목록·메인 카드 등에 표시되는 이미지입니다. 상세 본문에는 자동으로 표시되지 않습니다.</div>
        </div>
        <div class="mb-3">
            <label for="attachmentInput" class="form-label">첨부파일</label>
            <div id="attachmentPreview" class="mb-2" hidden>
                <span id="attachmentPreviewNameWrap" hidden>현재 첨부파일: <span id="attachmentPreviewName"></span> </span>
                (<a id="attachmentPreviewLink" href="#">열기/다운로드</a>)
                <button type="button" id="attachmentRemoveButton" class="btn btn-outline-secondary btn-sm">제거</button>
            </div>
            <input type="file" class="form-control" id="attachmentInput">
            <input type="hidden" id="attachment" name="attachment">
        </div>
        </fieldset>
        <fieldset class="mb-4">
        <legend class="h5">신청·모집</legend>
        <div class="mb-3">
            <label for="googleFormUrl" class="form-label">신청 Google Form URL</label>
            <input type="text" class="form-control" id="googleFormUrl" name="googleFormUrl" maxlength="500">
            <div class="form-text">http:// 또는 https://로 시작하는 주소입니다. 비워두면 공개 화면에 신청 버튼이 표시되지 않습니다.</div>
        </div>
        <div class="mb-3">
            <label for="recruitStatus" class="form-label">모집 상태</label>
            <select class="form-select" id="recruitStatus" name="recruitStatus">
                <option value="OPEN">모집중</option>
                <option value="CLOSED">마감</option>
            </select>
        </div>
        </fieldset>
        <fieldset class="mb-4">
        <legend class="h5">공개 설정</legend>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="isPublic" name="isPublic">
            <label for="isPublic" class="form-check-label">공개</label>
        </div>
        </fieldset>
        <div class="admin-form-actions">
            <a id="admin-form-cancel-link" href="/admin/programs" class="btn btn-outline-secondary">취소</a>
            <button type="submit" id="saveButton" class="btn btn-primary">저장</button>
        </div>
    </form>

<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="/js/admin/common-fetch.js"></script>
<script src="/js/admin/ckeditor-resize-plugin.js"></script>
<script src="/js/admin/ckeditor-config.js"></script>
<script src="/js/admin/ckeditor-upload-adapter.js"></script>
<script src="/js/admin/program-file-upload.js"></script>
<script src="/js/admin/admin-file-preview.js"></script>
<script src="/js/admin/admin-list-state.js"></script>
<script>
    var contentEditor = null;
    var errorMessage = document.querySelector('#errorMessage');
    var saveButton = document.querySelector('#saveButton');

    // P14-T9D: 오류는 role=alert 영역에 표시하고 focus해 긴 form 아래쪽에서 저장해도 바로 보이게 한다.
    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        errorMessage.focus();
    }

    var editorReady = ClassicEditor.create(document.querySelector('#content'), AdminCkeditorConfig.EDITOR_CONFIG)
        .then(function (editor) {
            contentEditor = editor;
            AdminCkeditorUploadAdapter.installUploadAdapterPlugin(editor, AdminFetch.adminFetch);
            AdminCkeditorResizePlugin.bindResizeControls(editor, document.querySelector('#content-resize-controls'));
            return editor;
        })
        .catch(function (error) {
            console.error(error);
        });

    function extractProgramIdFromPath() {
        var match = window.location.pathname.match(/^\/admin\/programs\/(\d+)\/edit$/);
        return match ? match[1] : null;
    }

    var editingProgramId = extractProgramIdFromPath();

    // P14-T9D: 등록/수정이 같은 template이므로 수정 모드에서만 heading을 바꾸고 문서 title도 같은 의미로 맞춘다.
    if (editingProgramId) {
        document.querySelector('#admin-form-heading').textContent = '프로그램 수정';
    }
    document.title = document.querySelector('#admin-form-heading').textContent;

    // P14-T9D: 목록에서 넘어온 form URL query(programType/keyword/page)를 allowlist 검증·정규화해 저장 후 이동과 취소가
    // 같은 목록 상태로 돌아가게 한다(raw query 복사나 임의 복귀 URL 파라미터 없음, form URL 자체는 정규화하지 않음). 새 프로그램은 첫
    // page에 나타나므로 등록 모드에서는 URL에 page가 있어도 page 0으로 돌아간다.
    var listState = AdminListState.readState(AdminListState.PROGRAM_LIST, window.location.search);
    if (!editingProgramId) {
        listState.page = 0;
    }
    var listHref = AdminListState.listHref(AdminListState.PROGRAM_LIST, listState);
    document.querySelector('#admin-form-cancel-link').href = listHref;

    if (editingProgramId) {
        document.querySelector('#programId').value = editingProgramId;

        Promise.all([
            AdminFetch.adminFetch('/api/admin/programs/' + editingProgramId)
                .then(function (response) {
                    return response.json();
                }),
            editorReady
        ]).then(function (results) {
            var body = results[0];
            var editor = results[1];
            var program = body.data;

            document.querySelector('#programType').value = program.programType;
            document.querySelector('#title').value = program.title;
            if (editor) {
                editor.setData(program.content || '');
            }
            document.querySelector('#thumbnail').value = program.thumbnail || '';
            document.querySelector('#attachment').value = program.attachment || '';
            document.querySelector('#googleFormUrl').value = program.googleFormUrl || '';
            document.querySelector('#recruitStatus').value = program.recruitStatus;
            document.querySelector('#isPublic').checked = program.isPublic;

            AdminFilePreview.renderImagePreview(
                document.querySelector('#thumbnailPreview'),
                document.querySelector('#thumbnailPreviewImage'),
                document.querySelector('#thumbnailPreviewLink'),
                program.thumbnail);
            AdminFilePreview.renderLinkPreview(
                document.querySelector('#attachmentPreview'),
                document.querySelector('#attachmentPreviewLink'),
                program.attachment);
            AdminFilePreview.loadAttachmentName(
                document.querySelector('#attachmentPreviewNameWrap'),
                document.querySelector('#attachmentPreviewName'),
                program.attachment,
                AdminFetch.adminFetch);
        });
    }

    document.querySelector('#thumbnailInput').addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) {
            return;
        }
        AdminProgramFileUpload.uploadFile(file, AdminProgramFileUpload.THUMBNAIL_FILE_TYPE, AdminFetch.adminFetch)
            .then(function (url) {
                document.querySelector('#thumbnail').value = url;
                AdminFilePreview.renderImagePreview(
                    document.querySelector('#thumbnailPreview'),
                    document.querySelector('#thumbnailPreviewImage'),
                    document.querySelector('#thumbnailPreviewLink'),
                    url);
            })
            .catch(function (error) {
                alert(error.message);
            });
    });

    document.querySelector('#attachmentInput').addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) {
            return;
        }
        AdminProgramFileUpload.uploadFile(file, AdminProgramFileUpload.ATTACHMENT_FILE_TYPE, AdminFetch.adminFetch)
            .then(function (url) {
                document.querySelector('#attachment').value = url;
                AdminFilePreview.renderLinkPreview(
                    document.querySelector('#attachmentPreview'),
                    document.querySelector('#attachmentPreviewLink'),
                    url);
                AdminFilePreview.loadAttachmentName(
                    document.querySelector('#attachmentPreviewNameWrap'),
                    document.querySelector('#attachmentPreviewName'),
                    url,
                    AdminFetch.adminFetch);
            })
            .catch(function (error) {
                alert(error.message);
            });
    });

    document.querySelector('#thumbnailRemoveButton').addEventListener('click', function () {
        document.querySelector('#thumbnail').value = '';
        AdminFilePreview.renderImagePreview(
            document.querySelector('#thumbnailPreview'),
            document.querySelector('#thumbnailPreviewImage'),
            document.querySelector('#thumbnailPreviewLink'),
            '');
    });

    document.querySelector('#attachmentRemoveButton').addEventListener('click', function () {
        document.querySelector('#attachment').value = '';
        AdminFilePreview.renderLinkPreview(
            document.querySelector('#attachmentPreview'),
            document.querySelector('#attachmentPreviewLink'),
            '');
        AdminFilePreview.loadAttachmentName(
            document.querySelector('#attachmentPreviewNameWrap'),
            document.querySelector('#attachmentPreviewName'),
            '',
            AdminFetch.adminFetch);
    });

    document.querySelector('#programForm').addEventListener('submit', function (event) {
        event.preventDefault();

        errorMessage.style.display = 'none';

        var programId = document.querySelector('#programId').value;
        var payload = {
            programType: document.querySelector('#programType').value,
            title: document.querySelector('#title').value,
            content: contentEditor ? contentEditor.getData() : document.querySelector('#content').value,
            thumbnail: document.querySelector('#thumbnail').value || null,
            attachment: document.querySelector('#attachment').value || null,
            googleFormUrl: document.querySelector('#googleFormUrl').value || null,
            recruitStatus: document.querySelector('#recruitStatus').value,
            isPublic: document.querySelector('#isPublic').checked
        };

        var url = programId ? '/api/admin/programs/' + programId : '/api/admin/programs';
        var method = programId ? 'PUT' : 'POST';

        // P14-T9D: 요청 중 중복 submit 방지 - 실패하면 다시 활성화하고, 성공하면 이동하므로 비활성 상태로 둔다.
        saveButton.disabled = true;
        AdminFetch.adminFetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
            .then(function (response) {
                return response.json().then(function (body) {
                    return {ok: response.ok, body: body};
                });
            })
            .then(function (result) {
                if (result.ok && result.body.success) {
                    window.location.href = listHref;
                } else {
                    saveButton.disabled = false;
                    showError((result.body.error && result.body.error.message)
                        || '저장 중 오류가 발생했습니다.');
                }
            })
            .catch(function () {
                saveButton.disabled = false;
                showError('저장 중 오류가 발생했습니다.');
            });
    });
</script>
</div>
</body>
</html>
