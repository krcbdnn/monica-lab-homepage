<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#admin-program-detail-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>프로그램 상세</title>
</head>
<body>
<!-- P14-T10: 읽기 전용 관리자 프로그램 상세. 공개 여부와 무관하게 조회되며(getAdminById), 본문은 공개 상세와
     같은 경로(저장 시 HtmlSanitizer → ContentLinkRenderer가 만든 renderedContent → th:utext)로만 출력한다.
     공개 상세(/programs/{id})는 모집 상태와 무관하게 공개 여부만 보므로 "공개 페이지 보기"도 isPublic만 본다.
     P14-T9C-1: 서버는 enum raw 값을 fallback 텍스트 + data-* 속성으로만 렌더하고, 아래 script가 목록과 같은
     관리자 공통 표시명/badge(AdminDisplay)로 바꾼다(JS 실패 시 raw 값이 그대로 보인다). 삭제는 목록에서만 제공한다. -->
<div id="admin-program-detail-content" class="admin-content-detail">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <h2 class="admin-content-detail__title" th:text="${program.title()}">제목</h2>
        <div class="admin-content-detail__actions">
            <a id="admin-detail-list-link" href="/admin/programs" class="btn btn-outline-secondary">목록으로</a>
            <a id="admin-detail-public-link" th:if="${program.isPublic()}" th:href="@{/programs/{id}(id=${program.id()})}"
               class="btn btn-outline-secondary" target="_blank" rel="noopener noreferrer">공개 페이지 보기</a>
            <a id="admin-detail-edit-link" th:href="@{/admin/programs/{id}/edit(id=${program.id()})}"
               class="btn btn-primary">수정</a>
        </div>
    </div>

    <dl class="admin-content-detail__meta">
        <div>
            <dt>프로그램 유형</dt>
            <dd id="admin-detail-program-type" th:data-program-type="${program.programType()}"
                th:text="${program.programType()}">COURSE</dd>
        </div>
        <div>
            <dt>모집 상태</dt>
            <dd id="admin-detail-recruit-status" th:data-recruit-status="${program.recruitStatus()}"
                th:text="${program.recruitStatus()}">OPEN</dd>
        </div>
        <div>
            <dt>공개 상태</dt>
            <dd id="admin-detail-visibility" th:data-public="${program.isPublic()}"
                th:text="${program.isPublic()} ? '공개' : '비공개'">공개</dd>
        </div>
        <div>
            <dt>등록일</dt>
            <dd id="admin-detail-created-at" th:text="${#temporals.format(program.createdAt(), 'yyyy.MM.dd HH:mm')}"></dd>
        </div>
        <div>
            <dt>수정일</dt>
            <dd id="admin-detail-updated-at" th:text="${#temporals.format(program.updatedAt(), 'yyyy.MM.dd HH:mm')}"></dd>
        </div>
        <div class="admin-content-detail__meta-wide">
            <dt>신청 URL</dt>
            <dd>
                <a id="admin-detail-apply-link" th:if="${program.googleFormUrl() != null}"
                   th:href="${program.googleFormUrl()}" th:text="${program.googleFormUrl()}"
                   target="_blank" rel="noopener noreferrer"></a>
                <span th:if="${program.googleFormUrl() == null}">-</span>
            </dd>
        </div>
        <div th:if="${program.thumbnail() != null}" class="admin-content-detail__meta-wide">
            <dt>대표 이미지</dt>
            <dd><img id="admin-detail-thumbnail" th:src="${program.thumbnail()}" alt="대표 이미지"
                     class="admin-content-detail__thumbnail"></dd>
        </div>
    </dl>

    <div class="ckeditor-content" th:if="${program.content() != null}" th:utext="${renderedContent}"></div>

    <div th:if="${program.attachment() != null}" class="admin-content-detail__attachment">
        <span>첨부파일</span>
        <a id="admin-detail-attachment-link" th:href="${program.attachment()}" target="_blank"
           rel="noopener noreferrer">열기/다운로드</a>
    </div>

    <script src="/js/admin/admin-list-state.js"></script>
    <script>
        (function () {
            // P14-T9C-2: 목록에서 넘어온 상세 URL query(programType/keyword/page)를 allowlist 검증·정규화해 "목록으로"
            // href만 그 목록 상태로 바꾼다(raw query를 그대로 붙이지 않음, JS가 없으면 서버가 렌더한 /admin/programs).
            // 수정/공개 페이지 링크에는 목록 state를 붙이지 않는다(수정 → 저장 → 목록 복귀는 P14-T9D).
            document.getElementById('admin-detail-list-link').href = AdminListState.listHref(AdminListState.PROGRAM_LIST,
                AdminListState.readState(AdminListState.PROGRAM_LIST, window.location.search));

            var typeEl = document.getElementById('admin-detail-program-type');
            AdminDisplay.replaceContent(typeEl, AdminDisplay.createBadge(document,
                AdminDisplay.label(AdminDisplay.PROGRAM_TYPE_LABELS, typeEl.getAttribute('data-program-type')),
                'neutral'));

            var statusEl = document.getElementById('admin-detail-recruit-status');
            var recruitStatus = statusEl.getAttribute('data-recruit-status');
            AdminDisplay.replaceContent(statusEl, AdminDisplay.createBadge(document,
                AdminDisplay.label(AdminDisplay.RECRUIT_STATUS_LABELS, recruitStatus),
                AdminDisplay.recruitStatusTone(recruitStatus)));

            var visibilityEl = document.getElementById('admin-detail-visibility');
            AdminDisplay.replaceContent(visibilityEl, AdminDisplay.createStateBadge(document,
                visibilityEl.getAttribute('data-public') === 'true', '공개', '비공개'));
        })();
    </script>
</div>
</body>
</html>
