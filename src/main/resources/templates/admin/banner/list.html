<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#banner-list-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>배너 관리</title>
</head>
<body>
<div id="banner-list-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>배너 관리</h2>
        <a href="/admin/banners/new" class="btn btn-primary">새 배너 등록</a>
    </div>

    <!-- P14-T9C-1: 삭제/전환/순서 변경 결과 inline status(AdminDisplay.showStatus/clearStatus). 기존 목록 전용
         #errorMessage를 대체한다. -->
    <div id="admin-list-status" hidden></div>

    <!-- P14-T9C-1: 좁은 화면에서 페이지 전체가 아니라 이 wrapper 안에서만 가로 스크롤된다. -->
    <div class="table-responsive">
    <table class="table">
        <thead>
        <tr>
            <th scope="col">이미지</th>
            <th scope="col">제목</th>
            <th scope="col">정렬 순서</th>
            <th scope="col">노출 여부</th>
            <th scope="col">관리</th>
        </tr>
        </thead>
        <tbody id="banner-list-body"></tbody>
    </table>
    </div>

    <script>
        var listStatus = document.getElementById('admin-list-status');
        var COLUMN_COUNT = 5;
        var ORDER_CHANGE_ERROR = '순서 변경 중 오류가 발생했습니다.';
        var STATUS_CHANGE_ERROR = '상태 변경 중 오류가 발생했습니다.';
        var DELETE_ERROR = '삭제 중 오류가 발생했습니다.';

        // P14-T9C-1: 실패 응답의 body가 JSON이 아니어도(세션 만료 HTML 등) fallback 문구로 표시한다.
        function showResponseError(response, fallback) {
            return response.json()
                .catch(function () {
                    return null;
                })
                .then(function (body) {
                    AdminDisplay.showStatus(listStatus, AdminDisplay.apiErrorMessage(body, fallback), 'error');
                });
        }

        // 전환/순서 변경 성공은 다시 그려진 목록 자체가 결과이므로 별도 성공 메시지 없이 목록만 다시 불러온다.
        function reloadOrShowError(response, fallback) {
            if (response.ok) {
                loadBanners();
                return undefined;
            }
            return showResponseError(response, fallback);
        }

        function renderRow(banner) {
            var tr = document.createElement('tr');

            var imageTd = document.createElement('td');
            var img = document.createElement('img');
            img.src = banner.image;
            img.alt = banner.title;
            img.style.maxWidth = '80px';
            img.style.maxHeight = '60px';
            imageTd.appendChild(img);
            tr.appendChild(imageTd);

            var titleTd = document.createElement('td');
            titleTd.textContent = banner.title;
            tr.appendChild(titleTd);

            var sortOrderTd = document.createElement('td');
            var sortOrderInput = document.createElement('input');
            sortOrderInput.type = 'number';
            sortOrderInput.min = '0';
            sortOrderInput.value = banner.sortOrder;
            sortOrderInput.className = 'form-control form-control-sm d-inline-block me-1';
            sortOrderInput.style.width = '80px';
            sortOrderTd.appendChild(sortOrderInput);

            var orderButton = document.createElement('button');
            orderButton.type = 'button';
            orderButton.className = 'btn btn-sm btn-outline-secondary';
            orderButton.textContent = '순서 변경';
            orderButton.addEventListener('click', function () {
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/banners/' + banner.id + '/order', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({sortOrder: Number(sortOrderInput.value)})
                })
                    .then(function (response) {
                        return reloadOrShowError(response, ORDER_CHANGE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, ORDER_CHANGE_ERROR, 'error');
                    });
            });
            sortOrderTd.appendChild(orderButton);
            tr.appendChild(sortOrderTd);

            var visibleTd = document.createElement('td');
            visibleTd.appendChild(AdminDisplay.createStateBadge(document, banner.isVisible, '노출', '비노출'));
            tr.appendChild(visibleTd);

            var actionTd = document.createElement('td');

            var editLink = document.createElement('a');
            editLink.href = '/admin/banners/' + banner.id + '/edit';
            editLink.className = 'btn btn-sm btn-outline-secondary me-1';
            editLink.textContent = '수정';
            actionTd.appendChild(editLink);

            var visibilityButton = document.createElement('button');
            visibilityButton.type = 'button';
            visibilityButton.className = 'btn btn-sm btn-outline-secondary me-1';
            visibilityButton.textContent = banner.isVisible ? '비노출로 전환' : '노출로 전환';
            visibilityButton.addEventListener('click', function () {
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/banners/' + banner.id + '/visibility', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({isVisible: !banner.isVisible})
                })
                    .then(function (response) {
                        return reloadOrShowError(response, STATUS_CHANGE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, STATUS_CHANGE_ERROR, 'error');
                    });
            });
            actionTd.appendChild(visibilityButton);

            var deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'btn btn-sm btn-outline-danger';
            deleteButton.textContent = '삭제';
            deleteButton.addEventListener('click', function () {
                if (!window.confirm('삭제하시겠습니까?')) {
                    return;
                }
                AdminDisplay.clearStatus(listStatus);
                AdminFetch.adminFetch('/api/admin/banners/' + banner.id, {method: 'DELETE'})
                    .then(function (response) {
                        if (response.ok) {
                            // loadBanners()는 status를 건드리지 않으므로 성공 메시지는 재조회(실패 포함) 후에도 남는다.
                            loadBanners();
                            AdminDisplay.showStatus(listStatus, '삭제되었습니다.', 'success');
                            return undefined;
                        }
                        return showResponseError(response, DELETE_ERROR);
                    })
                    .catch(function () {
                        AdminDisplay.showStatus(listStatus, DELETE_ERROR, 'error');
                    });
            });
            actionTd.appendChild(deleteButton);

            tr.appendChild(actionTd);
            return tr;
        }

        // P14-T9C-1: 이 함수는 inline status를 바꾸지 않는다(tbody만 담당). 응답 실패/JSON 파싱 실패/렌더링 예외
        // 모두 이전 행을 지우고 오류 행 하나만 남긴다.
        function loadBanners() {
            var tbody = document.getElementById('banner-list-body');
            AdminFetch.adminFetch('/api/admin/banners')
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.json();
                })
                .then(function (body) {
                    var banners = body.data;
                    tbody.innerHTML = '';
                    banners.forEach(function (banner) {
                        tbody.appendChild(renderRow(banner));
                    });
                    if (banners.length === 0) {
                        AdminDisplay.renderEmptyRow(document, tbody, COLUMN_COUNT, '등록된 배너가 없습니다.');
                    }
                })
                .catch(function () {
                    AdminDisplay.renderErrorRow(document, tbody, COLUMN_COUNT, '배너 목록을 불러오지 못했습니다.');
                });
        }

        loadBanners();
    </script>
</div>
</body>
</html>
