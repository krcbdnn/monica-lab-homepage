<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#banner-form-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>배너 등록/수정</title>
</head>
<body>
<!-- P14-T9D: 공통 form composition(.admin-form 800px, 등록/수정 heading, 필수 표시, role=alert 오류, [취소][저장]). -->
<div id="banner-form-content" class="admin-form">
    <h3 id="admin-form-heading" class="mb-2">배너 등록</h3>
    <p class="admin-form-required-note">* 표시는 필수 입력입니다.</p>
    <div id="errorMessage" class="alert alert-danger" role="alert" tabindex="-1" style="display: none;"></div>
    <form id="bannerForm">
        <input type="hidden" id="bannerId" name="bannerId">
        <div class="mb-3">
            <label for="title" class="form-label">제목<span class="admin-required" aria-hidden="true">*</span></label>
            <input type="text" class="form-control" id="title" name="title" required maxlength="100">
        </div>
        <div class="mb-3">
            <label for="imageInput" class="form-label">배너 이미지<span class="admin-required" aria-hidden="true">*</span></label>
            <div id="imagePreview" class="mb-2" hidden>
                <img id="imagePreviewImage" class="admin-file-preview__thumb" src="" alt="현재 등록된 배너 이미지">
                <div><a id="imagePreviewLink" href="#" target="_blank" rel="noopener noreferrer">새 창에서 보기</a></div>
            </div>
            <input type="file" class="form-control" id="imageInput" accept="image/*">
            <input type="hidden" id="image" name="image">
        </div>
        <div class="mb-3">
            <label for="linkUrl" class="form-label">링크 URL</label>
            <input type="text" class="form-control" id="linkUrl" name="linkUrl" maxlength="500">
            <div class="form-text">http:// 또는 https://로 시작하는 주소입니다. 비워두면 링크 없이 표시됩니다.</div>
        </div>
        <div class="mb-3">
            <label for="sortOrder" class="form-label">정렬 순서<span class="admin-required" aria-hidden="true">*</span></label>
            <input type="number" class="form-control" id="sortOrder" name="sortOrder" min="0" required>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="isVisible" name="isVisible">
            <label for="isVisible" class="form-check-label">노출</label>
        </div>
        <div class="admin-form-actions">
            <a id="admin-form-cancel-link" href="/admin/banners" class="btn btn-outline-secondary">취소</a>
            <button type="submit" id="saveButton" class="btn btn-primary">저장</button>
        </div>
    </form>

<script src="/js/admin/common-fetch.js"></script>
<script src="/js/admin/banner-file-upload.js"></script>
<script src="/js/admin/admin-file-preview.js"></script>
<script>
    var errorMessage = document.querySelector('#errorMessage');
    var saveButton = document.querySelector('#saveButton');

    // P14-T9D: 오류는 role=alert 영역에 표시하고 focus해 긴 form 아래쪽에서 저장해도 바로 보이게 한다.
    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        errorMessage.focus();
    }

    function extractBannerIdFromPath() {
        var match = window.location.pathname.match(/^\/admin\/banners\/(\d+)\/edit$/);
        return match ? match[1] : null;
    }

    var editingBannerId = extractBannerIdFromPath();

    // P14-T9D: 등록/수정이 같은 template이므로 수정 모드에서만 heading을 바꾸고 문서 title도 같은 의미로 맞춘다.
    if (editingBannerId) {
        document.querySelector('#admin-form-heading').textContent = '배너 수정';
    }
    document.title = document.querySelector('#admin-form-heading').textContent;

    if (editingBannerId) {
        document.querySelector('#bannerId').value = editingBannerId;

        AdminFetch.adminFetch('/api/admin/banners/' + editingBannerId)
            .then(function (response) {
                return response.json();
            })
            .then(function (body) {
                var banner = body.data;

                document.querySelector('#title').value = banner.title;
                document.querySelector('#image').value = banner.image || '';
                document.querySelector('#linkUrl').value = banner.linkUrl || '';
                document.querySelector('#sortOrder').value = banner.sortOrder;
                document.querySelector('#isVisible').checked = banner.isVisible;

                AdminFilePreview.renderImagePreview(
                    document.querySelector('#imagePreview'),
                    document.querySelector('#imagePreviewImage'),
                    document.querySelector('#imagePreviewLink'),
                    banner.image);
            });
    }

    document.querySelector('#imageInput').addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) {
            return;
        }
        AdminBannerFileUpload.uploadFile(file, AdminBannerFileUpload.IMAGE_FILE_TYPE, AdminFetch.adminFetch)
            .then(function (url) {
                document.querySelector('#image').value = url;
                AdminFilePreview.renderImagePreview(
                    document.querySelector('#imagePreview'),
                    document.querySelector('#imagePreviewImage'),
                    document.querySelector('#imagePreviewLink'),
                    url);
            })
            .catch(function (error) {
                alert(error.message);
            });
    });

    document.querySelector('#bannerForm').addEventListener('submit', function (event) {
        event.preventDefault();

        errorMessage.style.display = 'none';

        // P14-T9D: 서버(BannerRequest.image @NotBlank)와 같은 필수 계약을 저장 전에 확인한다(요청을 보내지 않음).
        if (!document.querySelector('#image').value) {
            showError('배너 이미지를 등록해야 합니다.');
            return;
        }

        var bannerId = document.querySelector('#bannerId').value;
        var payload = {
            title: document.querySelector('#title').value,
            image: document.querySelector('#image').value || null,
            linkUrl: document.querySelector('#linkUrl').value || null,
            sortOrder: Number(document.querySelector('#sortOrder').value),
            isVisible: document.querySelector('#isVisible').checked
        };

        var url = bannerId ? '/api/admin/banners/' + bannerId : '/api/admin/banners';
        var method = bannerId ? 'PUT' : 'POST';

        // P14-T9D: 요청 중 중복 submit 방지 - 실패하면 다시 활성화하고, 성공하면 이동하므로 비활성 상태로 둔다.
        saveButton.disabled = true;
        AdminFetch.adminFetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
            .then(function (response) {
                return response.json().then(function (body) {
                    return {ok: response.ok, body: body};
                });
            })
            .then(function (result) {
                if (result.ok && result.body.success) {
                    window.location.href = '/admin/banners';
                } else {
                    saveButton.disabled = false;
                    showError((result.body.error && result.body.error.message)
                        || '저장 중 오류가 발생했습니다.');
                }
            })
            .catch(function () {
                saveButton.disabled = false;
                showError('저장 중 오류가 발생했습니다.');
            });
    });
</script>
</div>
</body>
</html>
