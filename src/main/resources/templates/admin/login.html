<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin/admin.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 100px;">
    <h3 class="mb-4">관리자 로그인</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label for="loginId" class="form-label">아이디</label>
            <input type="text" class="form-control" id="loginId" name="loginId" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div id="errorMessage" class="text-danger mb-3" style="display: none;"></div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();

        var loginId = document.getElementById('loginId').value;
        var password = document.getElementById('password').value;
        var errorMessage = document.getElementById('errorMessage');
        errorMessage.style.display = 'none';

        fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ loginId: loginId, password: password })
        })
            .then(function (response) {
                return response.json().then(function (body) {
                    return { ok: response.ok, body: body };
                });
            })
            .then(function (result) {
                if (result.ok && result.body.success) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorMessage.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
                    errorMessage.style.display = 'block';
                }
            })
            .catch(function () {
                errorMessage.textContent = '로그인 중 오류가 발생했습니다.';
                errorMessage.style.display = 'block';
            });
    });
</script>
</body>
</html>
