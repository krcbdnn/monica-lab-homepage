<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- P14-T9B: admin/layout/default.html과 동일한 이유로 동일 Pretendard CDN을 재사용한다. -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link href="/css/admin/admin.css" rel="stylesheet">
</head>
<body class="admin-login-body">
<!-- P14-T9B: login.html은 공통 admin/layout/default.html(header/sidebar)을 쓰지 않는 독립 화면이다.
     P14-T9B(3차 보강): 실제 화면이 "Bootstrap sample form"처럼 보인다는 피드백에 따라 presentation
     markup만 재구성한다 - warm-neutral 전체 화면 중앙의 white 인증 panel, header와 동일한 텍스트
     monogram+기관명+ADMIN context, 안내 문구, navy full-width 로그인 버튼, 하단 저작권 한 줄.
     form id/필드 name/id/#errorMessage/submit 버튼, 아래 인증 script(/api/admin/login)는 전부 무변경. -->
<main class="admin-login">
    <div class="admin-login-card">
        <div class="admin-login-card__identity">
            <span class="admin-brand__mark" aria-hidden="true">M</span>
            <span class="admin-brand__text">
                <span class="admin-login-card__brand">모니카영어교육연구소</span>
                <span class="admin-brand__context">ADMIN</span>
            </span>
        </div>
        <h3 class="admin-login-card__title">관리자 로그인</h3>
        <p class="admin-login-card__lead">관리자 계정으로 로그인해 홈페이지 콘텐츠를 관리합니다.</p>
        <form id="loginForm">
            <div class="mb-3">
                <label for="loginId" class="form-label">아이디</label>
                <input type="text" class="form-control" id="loginId" name="loginId" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div id="errorMessage" class="text-danger mb-3" style="display: none;"></div>
            <button type="submit" class="btn btn-primary w-100 admin-login-card__submit">로그인</button>
        </form>
    </div>
    <p class="admin-login__footnote">&copy; 모니카영어교육연구소</p>
</main>
<script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();

        var loginId = document.getElementById('loginId').value;
        var password = document.getElementById('password').value;
        var errorMessage = document.getElementById('errorMessage');
        errorMessage.style.display = 'none';

        fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ loginId: loginId, password: password })
        })
            .then(function (response) {
                return response.json().then(function (body) {
                    return { ok: response.ok, body: body };
                });
            })
            .then(function (result) {
                if (result.ok && result.body.success) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorMessage.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
                    errorMessage.style.display = 'block';
                }
            })
            .catch(function () {
                errorMessage.textContent = '로그인 중 오류가 발생했습니다.';
                errorMessage.style.display = 'block';
            });
    });
</script>
</body>
</html>
