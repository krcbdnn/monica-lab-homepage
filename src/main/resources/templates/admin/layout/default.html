<!DOCTYPE html>
<html th:fragment="layout(content)" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title != null} ? ${title} : '관리자'">관리자</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- P14-T9B: Public(home/layout/default.html)이 이미 쓰는 것과 동일한 Pretendard Variable(OFL),
         jsDelivr, 버전 고정(v1.3.9), dynamic subset, font-display: swap - 신규 CDN/의존성 추가 없음.
         로딩 실패 시 admin.css의 시스템 한글 sans fallback으로 대체된다. -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link th:href="@{/css/admin/admin.css}" rel="stylesheet">
    <script src="/js/admin/common-fetch.js"></script>
</head>
<body class="admin-body">
<!-- P14-T9B(3차 보강): Admin shell 구조 - header(white) / sidebar(white panel, 본문 높이 전체) /
     warm-neutral 작업 영역 안의 .admin-page(white content surface) / footer(작업 영역 하단).
     footer를 작업 영역 column 안으로 옮겨 sidebar가 footer 위에서 끊기지 않게 했다.
     header/sidebar fragment, #admin-footer id, script 순서/계약은 무변경(presentation wrapper만 추가). -->
<div th:replace="~{admin/layout/header :: header}"></div>
<div class="admin-shell d-flex">
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>
    <div class="admin-workspace flex-grow-1 d-flex flex-column">
        <main class="admin-main flex-grow-1">
            <div class="admin-page">
                <th:block th:replace="${content}"></th:block>
            </div>
        </main>
        <footer id="admin-footer" class="admin-footer">
            &copy; 모니카영어교육연구소
        </footer>
    </div>
</div>

<script src="/js/admin/admin-header.js"></script>
<script src="/js/admin/admin-layout.js"></script>
<script>
    AdminHeader.bootstrap(AdminFetch.adminFetch, document);
    AdminLayout.bootstrap(AdminFetch.adminFetch, document);
</script>
</body>
</html>
