<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#password-form-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>비밀번호 변경</title>
</head>
<body>
<!-- P15-T6: 본인 비밀번호 변경 화면. theme/form.html과 같은 단일 설정 화면 구조(.admin-form, inline error/success
     alert, 저장 중 버튼 비활성화)를 따른다. "새 비밀번호 확인"은 화면에서만 비교하고 API에는 보내지 않는다
     (API 계약은 currentPassword/newPassword 2개). 비밀번호 값은 console/DOM 다른 곳에 남기지 않는다. -->
<div id="password-form-content" class="admin-form">
    <h3 class="mb-2">비밀번호 변경</h3>
    <p class="text-muted mb-4">현재 로그인한 관리자 계정의 비밀번호를 변경합니다.</p>
    <div id="errorMessage" class="alert alert-danger" role="alert" style="display: none;"></div>
    <div id="successMessage" class="alert alert-success" role="status" style="display: none;">비밀번호가 변경되었습니다.</div>
    <form id="passwordForm" novalidate>
        <div class="mb-3">
            <label for="currentPassword" class="form-label">현재 비밀번호</label>
            <input type="password" class="form-control" id="currentPassword" name="currentPassword"
                   autocomplete="current-password" required>
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label">새 비밀번호</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword"
                   autocomplete="new-password" maxlength="64" aria-describedby="newPasswordHelp" required>
            <ul id="newPasswordHelp" class="form-text mb-0 ps-3">
                <li>8자 이상 64자 이하</li>
                <li>영문, 숫자, 특수문자 중 2종류 이상 포함</li>
                <li>공백과 한글 등 영문 키보드 외 문자는 사용할 수 없습니다</li>
                <li>현재 비밀번호와 다르게 입력</li>
            </ul>
        </div>
        <div class="mb-4">
            <label for="newPasswordConfirm" class="form-label">새 비밀번호 확인</label>
            <input type="password" class="form-control" id="newPasswordConfirm" name="newPasswordConfirm"
                   autocomplete="new-password" maxlength="64" required>
        </div>
        <div class="admin-form-actions">
            <button type="submit" id="saveButton" class="btn btn-primary">변경</button>
        </div>
    </form>

<script src="/js/admin/common-fetch.js"></script>
<script>
    var errorMessage = document.querySelector('#errorMessage');
    var successMessage = document.querySelector('#successMessage');
    var saveButton = document.querySelector('#saveButton');
    var passwordForm = document.querySelector('#passwordForm');
    var currentPasswordInput = document.querySelector('#currentPassword');
    var newPasswordInput = document.querySelector('#newPassword');
    var newPasswordConfirmInput = document.querySelector('#newPasswordConfirm');

    function showError(message) {
        successMessage.style.display = 'none';
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
    }

    function showSuccess() {
        errorMessage.style.display = 'none';
        successMessage.style.display = 'block';
    }

    function clearPasswordInputs() {
        currentPasswordInput.value = '';
        newPasswordInput.value = '';
        newPasswordConfirmInput.value = '';
    }

    // 서버 오류 응답(ApiResponse)을 화면 문구로 바꾼다. Validation 실패는 필드별 정책 문구(fields[].reason)를 보여준다.
    function errorMessageOf(body) {
        var error = body && body.error;
        if (!error) {
            return '비밀번호 변경 중 오류가 발생했습니다.';
        }
        if (error.fields && error.fields.length > 0) {
            return error.fields.map(function (field) {
                return field.reason;
            }).join(' ');
        }
        return error.message || '비밀번호 변경 중 오류가 발생했습니다.';
    }

    passwordForm.addEventListener('submit', function (event) {
        event.preventDefault();

        errorMessage.style.display = 'none';
        successMessage.style.display = 'none';

        if (!currentPasswordInput.value || !newPasswordInput.value || !newPasswordConfirmInput.value) {
            showError('현재 비밀번호, 새 비밀번호, 새 비밀번호 확인을 모두 입력해 주세요.');
            return;
        }
        if (newPasswordInput.value !== newPasswordConfirmInput.value) {
            showError('새 비밀번호와 새 비밀번호 확인이 일치하지 않습니다.');
            return;
        }
        if (newPasswordInput.value === currentPasswordInput.value) {
            showError('새 비밀번호는 현재 비밀번호와 달라야 합니다.');
            return;
        }

        saveButton.disabled = true;

        AdminFetch.adminFetch('/api/admin/me/password', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                currentPassword: currentPasswordInput.value,
                newPassword: newPasswordInput.value
            })
        })
            .then(function (response) {
                return response.json().then(function (body) {
                    return {ok: response.ok, body: body};
                });
            })
            .then(function (result) {
                if (result.ok && result.body.success) {
                    clearPasswordInputs();
                    showSuccess();
                } else {
                    showError(errorMessageOf(result.body));
                }
            })
            .catch(function () {
                showError('비밀번호 변경 중 오류가 발생했습니다.');
            })
            .finally(function () {
                saveButton.disabled = false;
            });
    });
</script>
</div>
</body>
</html>
