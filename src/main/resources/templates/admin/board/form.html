<!DOCTYPE html>
<html th:replace="~{admin/layout/default :: layout(~{::#board-form-content})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 등록/수정</title>
</head>
<body>
<div id="board-form-content" style="max-width: 800px;">
    <h3 class="mb-4">게시글 등록/수정</h3>
    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    <form id="boardForm">
        <input type="hidden" id="boardId" name="boardId">
        <div class="mb-3">
            <label for="boardType" class="form-label">게시판 구분</label>
            <select class="form-select" id="boardType" name="boardType" required>
                <option value="NOTICE">공지사항</option>
                <option value="GALLERY">갤러리</option>
                <option value="ARCHIVE">자료실</option>
                <option value="REVIEW">강의 후기</option>
            </select>
        </div>
        <!-- P13-T30D(Task C): 강의 후기(REVIEW)일 때만 노출되는 subtype 선택. 신규 작성 시 COURSE/SPECIAL
             중 하나를 반드시 명시적으로 선택하게 하기 위해 첫 옵션은 빈 값(placeholder)이다 - 브라우저가
             옵션 순서상 첫 번째("수강 후기")를 암묵적으로 기본 선택하지 않도록 하는 장치다. 기존 REVIEW+NULL
             (legacy) 게시글을 수정 화면에서 열어도 이 placeholder가 그대로 선택된 채로 보여야 하므로,
             JS에서 board.programType이 없을 때 임의로 COURSE를 채우지 않는다(아래 스크립트 참고). -->
        <div class="mb-3" id="programTypeField" hidden>
            <label for="programType" class="form-label">후기 대상</label>
            <select class="form-select" id="programType" name="programType">
                <option value="">후기 대상을 선택하세요</option>
                <option value="COURSE">수강 후기</option>
                <option value="SPECIAL">특강 후기</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title" required maxlength="200">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="8"></textarea>
        </div>
        <div class="mb-3">
            <label for="thumbnailInput" class="form-label">대표 이미지</label>
            <div id="thumbnailPreview" class="mb-2" hidden>
                <img id="thumbnailPreviewImage" class="admin-file-preview__thumb" src="" alt="현재 등록된 대표 이미지">
                <div>
                    <a id="thumbnailPreviewLink" href="#" target="_blank" rel="noopener noreferrer">새 창에서 보기</a>
                    <button type="button" id="thumbnailRemoveButton" class="btn btn-outline-secondary btn-sm">제거</button>
                </div>
            </div>
            <input type="file" class="form-control" id="thumbnailInput" accept="image/*">
            <input type="hidden" id="thumbnail" name="thumbnail">
        </div>
        <div class="mb-3">
            <label for="attachmentInput" class="form-label">첨부파일</label>
            <div id="attachmentPreview" class="mb-2" hidden>
                <span id="attachmentPreviewNameWrap" hidden>현재 첨부파일: <span id="attachmentPreviewName"></span> </span>
                (<a id="attachmentPreviewLink" href="#">열기/다운로드</a>)
                <button type="button" id="attachmentRemoveButton" class="btn btn-outline-secondary btn-sm">제거</button>
            </div>
            <input type="file" class="form-control" id="attachmentInput">
            <input type="hidden" id="attachment" name="attachment">
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="isPublic" name="isPublic">
            <label for="isPublic" class="form-check-label">공개</label>
        </div>
        <button type="submit" class="btn btn-primary">저장</button>
    </form>

<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="/js/admin/common-fetch.js"></script>
<script src="/js/admin/ckeditor-config.js"></script>
<script src="/js/admin/ckeditor-upload-adapter.js"></script>
<script src="/js/admin/board-file-upload.js"></script>
<script src="/js/admin/admin-file-preview.js"></script>
<script>
    var contentEditor = null;

    var editorReady = ClassicEditor.create(document.querySelector('#content'), AdminCkeditorConfig.EDITOR_CONFIG)
        .then(function (editor) {
            contentEditor = editor;
            AdminCkeditorUploadAdapter.installUploadAdapterPlugin(editor, AdminFetch.adminFetch);
            return editor;
        })
        .catch(function (error) {
            console.error(error);
        });

    function extractBoardIdFromPath() {
        var match = window.location.pathname.match(/^\/admin\/boards\/(\d+)\/edit$/);
        return match ? match[1] : null;
    }

    var editingBoardId = extractBoardIdFromPath();

    // P13-T30D(Task C): boardType이 REVIEW일 때만 programType 필드를 노출한다. REVIEW가 아닌 값으로
    // 바뀌면 필드를 숨기고 값도 함께 비워(payload에서 항상 null로 나가도록) 서버에 stale programType이
    // 실려 가지 않게 한다. REVIEW로 바뀌었을 때는 기존 선택값(있다면)을 지우지 않는다 - 이 함수는
    // "숨김 전환 시 초기화"만 담당하고, 값 채우기는 아래 edit-mode 로딩/사용자의 직접 선택이 담당한다.
    function updateProgramTypeVisibility() {
        var isReview = document.querySelector('#boardType').value === 'REVIEW';
        document.querySelector('#programTypeField').hidden = !isReview;
        if (!isReview) {
            document.querySelector('#programType').value = '';
        }
    }
    document.querySelector('#boardType').addEventListener('change', updateProgramTypeVisibility);
    updateProgramTypeVisibility();

    if (editingBoardId) {
        document.querySelector('#boardId').value = editingBoardId;

        Promise.all([
            AdminFetch.adminFetch('/api/admin/boards/' + editingBoardId)
                .then(function (response) {
                    return response.json();
                }),
            editorReady
        ]).then(function (results) {
            var body = results[0];
            var editor = results[1];
            var board = body.data;

            document.querySelector('#boardType').value = board.boardType;
            // P13-T30D(Task C): 기존 REVIEW+NULL(legacy) 게시글은 board.programType이 없으므로 ''로
            // 남겨 placeholder("후기 대상을 선택하세요")가 그대로 보이게 한다 - 절대 COURSE를 임의로
            // 채우지 않는다. updateProgramTypeVisibility()는 REVIEW일 때 값을 건드리지 않으므로 이
            // 대입 이후에 호출해도 방금 채운 값이 유지된다.
            document.querySelector('#programType').value = board.programType || '';
            updateProgramTypeVisibility();
            document.querySelector('#title').value = board.title;
            if (editor) {
                editor.setData(board.content || '');
            }
            document.querySelector('#thumbnail').value = board.thumbnail || '';
            document.querySelector('#attachment').value = board.attachment || '';
            document.querySelector('#isPublic').checked = board.isPublic;

            AdminFilePreview.renderImagePreview(
                document.querySelector('#thumbnailPreview'),
                document.querySelector('#thumbnailPreviewImage'),
                document.querySelector('#thumbnailPreviewLink'),
                board.thumbnail);
            AdminFilePreview.renderLinkPreview(
                document.querySelector('#attachmentPreview'),
                document.querySelector('#attachmentPreviewLink'),
                board.attachment);
            AdminFilePreview.loadAttachmentName(
                document.querySelector('#attachmentPreviewNameWrap'),
                document.querySelector('#attachmentPreviewName'),
                board.attachment,
                AdminFetch.adminFetch);
        });
    }

    document.querySelector('#thumbnailInput').addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) {
            return;
        }
        AdminBoardFileUpload.uploadFile(file, AdminBoardFileUpload.THUMBNAIL_FILE_TYPE, AdminFetch.adminFetch)
            .then(function (url) {
                document.querySelector('#thumbnail').value = url;
                AdminFilePreview.renderImagePreview(
                    document.querySelector('#thumbnailPreview'),
                    document.querySelector('#thumbnailPreviewImage'),
                    document.querySelector('#thumbnailPreviewLink'),
                    url);
            })
            .catch(function (error) {
                alert(error.message);
            });
    });

    document.querySelector('#attachmentInput').addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) {
            return;
        }
        AdminBoardFileUpload.uploadFile(file, AdminBoardFileUpload.ATTACHMENT_FILE_TYPE, AdminFetch.adminFetch)
            .then(function (url) {
                document.querySelector('#attachment').value = url;
                AdminFilePreview.renderLinkPreview(
                    document.querySelector('#attachmentPreview'),
                    document.querySelector('#attachmentPreviewLink'),
                    url);
                AdminFilePreview.loadAttachmentName(
                    document.querySelector('#attachmentPreviewNameWrap'),
                    document.querySelector('#attachmentPreviewName'),
                    url,
                    AdminFetch.adminFetch);
            })
            .catch(function (error) {
                alert(error.message);
            });
    });

    document.querySelector('#thumbnailRemoveButton').addEventListener('click', function () {
        document.querySelector('#thumbnail').value = '';
        AdminFilePreview.renderImagePreview(
            document.querySelector('#thumbnailPreview'),
            document.querySelector('#thumbnailPreviewImage'),
            document.querySelector('#thumbnailPreviewLink'),
            '');
    });

    document.querySelector('#attachmentRemoveButton').addEventListener('click', function () {
        document.querySelector('#attachment').value = '';
        AdminFilePreview.renderLinkPreview(
            document.querySelector('#attachmentPreview'),
            document.querySelector('#attachmentPreviewLink'),
            '');
        AdminFilePreview.loadAttachmentName(
            document.querySelector('#attachmentPreviewNameWrap'),
            document.querySelector('#attachmentPreviewName'),
            '',
            AdminFetch.adminFetch);
    });

    document.querySelector('#boardForm').addEventListener('submit', function (event) {
        event.preventDefault();

        var errorMessage = document.querySelector('#errorMessage');
        errorMessage.style.display = 'none';

        var boardTypeValue = document.querySelector('#boardType').value;
        var programTypeValue = document.querySelector('#programType').value;

        // P13-T30D(Task C): REVIEW인데 placeholder(빈 값)인 채로는 저장을 막고 명시적 선택을
        // 요구한다 - "브라우저가 COURSE를 기본 선택해서 무심코 저장되는" 경로를 클라이언트에서부터
        // 차단한다(서버 MenuService/BoardService 쪽은 REVIEW+NULL을 계속 허용하는 것과 별개로,
        // 이 화면을 통한 신규/수정 저장에서는 명시적 선택을 강제한다).
        if (boardTypeValue === 'REVIEW' && !programTypeValue) {
            errorMessage.textContent = '후기 대상(수강 후기/특강 후기)을 선택해야 합니다.';
            errorMessage.style.display = 'block';
            return;
        }

        var boardId = document.querySelector('#boardId').value;
        var payload = {
            boardType: boardTypeValue,
            title: document.querySelector('#title').value,
            content: contentEditor ? contentEditor.getData() : document.querySelector('#content').value,
            thumbnail: document.querySelector('#thumbnail').value || null,
            attachment: document.querySelector('#attachment').value || null,
            isPublic: document.querySelector('#isPublic').checked,
            // REVIEW가 아니면 select 값이 남아있더라도 항상 null로 정규화해 전송한다.
            programType: boardTypeValue === 'REVIEW' ? programTypeValue : null
        };

        var url = boardId ? '/api/admin/boards/' + boardId : '/api/admin/boards';
        var method = boardId ? 'PUT' : 'POST';

        AdminFetch.adminFetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
            .then(function (response) {
                return response.json().then(function (body) {
                    return {ok: response.ok, body: body};
                });
            })
            .then(function (result) {
                if (result.ok && result.body.success) {
                    window.location.href = '/admin/boards';
                } else {
                    errorMessage.textContent = (result.body.error && result.body.error.message)
                        || '저장 중 오류가 발생했습니다.';
                    errorMessage.style.display = 'block';
                }
            })
            .catch(function () {
                errorMessage.textContent = '저장 중 오류가 발생했습니다.';
                errorMessage.style.display = 'block';
            });
    });
</script>
</div>
</body>
</html>
