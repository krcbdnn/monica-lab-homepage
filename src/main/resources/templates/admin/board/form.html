<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 등록/수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 800px; margin-top: 40px;">
    <h3 class="mb-4">게시글 등록/수정</h3>
    <form id="boardForm">
        <input type="hidden" id="boardId" name="boardId">
        <div class="mb-3">
            <label for="boardType" class="form-label">게시판 구분</label>
            <select class="form-select" id="boardType" name="boardType" required>
                <option value="NOTICE">공지사항</option>
                <option value="GALLERY">갤러리</option>
                <option value="ARCHIVE">자료실</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title" required maxlength="200">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="8"></textarea>
        </div>
        <div class="mb-3">
            <label for="thumbnailInput" class="form-label">대표 이미지</label>
            <input type="file" class="form-control" id="thumbnailInput" accept="image/*">
            <input type="hidden" id="thumbnail" name="thumbnail">
        </div>
        <div class="mb-3">
            <label for="attachmentInput" class="form-label">첨부파일</label>
            <input type="file" class="form-control" id="attachmentInput">
            <input type="hidden" id="attachment" name="attachment">
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="isPublic" name="isPublic">
            <label for="isPublic" class="form-check-label">공개</label>
        </div>
        <button type="submit" class="btn btn-primary">저장</button>
    </form>
</div>

<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="/js/admin/common-fetch.js"></script>
<script src="/js/admin/ckeditor-upload-adapter.js"></script>
<script src="/js/admin/board-file-upload.js"></script>
<script>
    var contentEditor = null;

    ClassicEditor.create(document.querySelector('#content'))
        .then(function (editor) {
            contentEditor = editor;
            AdminCkeditorUploadAdapter.installUploadAdapterPlugin(editor, AdminFetch.adminFetch);
        })
        .catch(function (error) {
            console.error(error);
        });

    document.querySelector('#thumbnailInput').addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) {
            return;
        }
        AdminBoardFileUpload.uploadFile(file, AdminBoardFileUpload.THUMBNAIL_FILE_TYPE, AdminFetch.adminFetch)
            .then(function (url) {
                document.querySelector('#thumbnail').value = url;
            })
            .catch(function (error) {
                alert(error.message);
            });
    });

    document.querySelector('#attachmentInput').addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) {
            return;
        }
        AdminBoardFileUpload.uploadFile(file, AdminBoardFileUpload.ATTACHMENT_FILE_TYPE, AdminFetch.adminFetch)
            .then(function (url) {
                document.querySelector('#attachment').value = url;
            })
            .catch(function (error) {
                alert(error.message);
            });
    });

    document.querySelector('#boardForm').addEventListener('submit', function (event) {
        event.preventDefault();

        var boardId = document.querySelector('#boardId').value;
        var payload = {
            boardType: document.querySelector('#boardType').value,
            title: document.querySelector('#title').value,
            content: contentEditor ? contentEditor.getData() : document.querySelector('#content').value,
            thumbnail: document.querySelector('#thumbnail').value || null,
            attachment: document.querySelector('#attachment').value || null,
            isPublic: document.querySelector('#isPublic').checked
        };

        var url = boardId ? '/api/admin/boards/' + boardId : '/api/admin/boards';
        var method = boardId ? 'PUT' : 'POST';

        AdminFetch.adminFetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
    });
</script>
</body>
</html>
