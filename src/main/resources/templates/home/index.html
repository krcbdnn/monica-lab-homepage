<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>모니카 연구소</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="margin-top: 40px;">

    <nav id="quick-menu" class="mb-4">
        <a href="/pages/GREETING">기관소개</a>
        <a href="/programs">프로그램</a>
        <a href="/boards">게시판</a>
    </nav>

    <section id="banners" class="mb-4">
        <div th:each="banner : ${banners}" class="banner-item">
            <a th:if="${banner.linkUrl() != null}" th:href="${banner.linkUrl()}">
                <img th:src="${banner.image()}" th:alt="${banner.title()}">
            </a>
            <img th:unless="${banner.linkUrl() != null}" th:src="${banner.image()}" th:alt="${banner.title()}">
        </div>
    </section>

    <section id="popups" class="mb-4">
        <div th:each="popup : ${popups}" class="popup-item">
            <span th:text="${popup.title()}"></span>
        </div>
    </section>

    <section id="greeting" class="mb-4">
        <h3 th:text="${greeting.title()}"></h3>
        <div th:if="${greeting.content() != null}" th:utext="${greeting.content()}"></div>
        <p th:unless="${greeting.content() != null}" class="text-muted">등록된 인사말이 없습니다.</p>
    </section>

    <section id="latest-notices" class="mb-4">
        <h4>최신 공지</h4>
        <ul>
            <li th:each="notice : ${latestNotices}">
                <a th:href="@{/boards/{id}(id=${notice.id()})}" th:text="${notice.title()}"></a>
            </li>
        </ul>
    </section>

    <section id="latest-gallery" class="mb-4">
        <h4>최신 갤러리</h4>
        <ul>
            <li th:each="gallery : ${latestGallery}">
                <a th:href="@{/boards/{id}(id=${gallery.id()})}" th:text="${gallery.title()}"></a>
            </li>
        </ul>
    </section>

    <section id="program-shortcut" class="mb-4">
        <a href="/programs" class="btn btn-primary">프로그램 살펴보기</a>
    </section>

</div>
</body>
</html>
