<!DOCTYPE html>
<html th:replace="~{home/layout/default :: layout(~{::#index-content}, '모니카 연구소')}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>모니카 연구소</title>
</head>
<body>
<div id="index-content" class="container" style="margin-top: 40px;">

    <section id="banners" class="hero">
        <div th:if="${!#lists.isEmpty(banners)}" class="hero__viewport" id="hero-viewport">
            <div class="hero__slide" th:each="banner, iter : ${banners}"
                 th:attr="hidden=${iter.first} ? null : 'hidden'">
                <a th:if="${banner.linkUrl() != null}" th:href="${banner.linkUrl()}" class="hero__link">
                    <img th:src="${banner.image()}" th:alt="${banner.title()}" loading="eager" class="hero__image"
                         th:attr="fetchpriority=${iter.first} ? 'high' : null">
                </a>
                <div th:unless="${banner.linkUrl() != null}" class="hero__link">
                    <img th:src="${banner.image()}" th:alt="${banner.title()}" loading="eager" class="hero__image"
                         th:attr="fetchpriority=${iter.first} ? 'high' : null">
                </div>
                <p class="hero__caption" th:text="${banner.title()}"></p>
            </div>
        </div>

        <div th:if="${#lists.size(banners) gt 1}" class="hero__controls" id="hero-controls">
            <button type="button" class="hero__nav hero__nav--prev" id="hero-prev" aria-label="이전 배너">‹</button>
            <button type="button" class="hero__nav hero__nav--next" id="hero-next" aria-label="다음 배너">›</button>
            <div class="hero__bottom-bar">
                <button type="button" class="hero__play-pause" id="hero-play-pause"
                        aria-label="배너 자동 전환 일시정지">일시정지</button>
                <div class="hero__indicators" id="hero-indicators" role="group" aria-label="배너 선택">
                    <button type="button" class="hero__indicator" th:each="banner, iter : ${banners}"
                            th:classappend="${iter.first} ? ' is-active'"
                            th:attr="aria-label=${banner.title() + ' 배너로 이동'}, aria-current=${iter.first} ? 'true' : null"
                            th:text="${iter.count}"></button>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(banners)}" class="hero__empty">
            <p>등록된 배너가 없습니다.</p>
        </div>
    </section>

    <section id="popups">
        <div id="popup-overlay" class="popup-overlay" th:if="${!#lists.isEmpty(popups)}" hidden>
            <div class="popup-modal" th:each="popup : ${popups}" role="dialog"
                 th:attr="id='popup-modal-' + ${popup.id()}, aria-labelledby='popup-modal-title-' + ${popup.id()}, data-popup-id=${popup.id()}, hidden='hidden'">
                <div class="popup-modal__header">
                    <h2 class="popup-modal__title" th:text="${popup.title()}"
                        th:attr="id='popup-modal-title-' + ${popup.id()}"></h2>
                    <button type="button" class="popup-modal__close" aria-label="팝업 닫기">×</button>
                </div>
                <div class="popup-modal__body" th:if="${popup.content() != null}" th:utext="${popup.content()}"></div>
                <button type="button" class="popup-modal__hide-today">오늘 하루 보지 않기</button>
            </div>
        </div>
    </section>

    <section id="greeting" class="institute-intro">
        <h2 class="section-title" th:text="${greeting.title()}"></h2>
        <div class="institute-intro__body" th:if="${greeting.content() != null}" th:utext="${greeting.content()}"></div>
        <p th:unless="${greeting.content() != null}" class="text-muted">등록된 인사말이 없습니다.</p>
        <a th:if="${greeting.content() != null}" href="/pages/GREETING" class="institute-intro__more">자세히 보기</a>
    </section>

    <section id="latest-programs" class="section">
        <h2 class="section-title">최신 프로그램</h2>

        <div th:if="${!latestPrograms.isEmpty()}" class="program-cards">
            <article th:each="program : ${latestPrograms}" class="program-card">
                <a th:href="@{/programs/{id}(id=${program.id()})}" class="program-card__link">
                    <div class="program-card__thumb">
                        <img th:if="${program.thumbnail() != null}" th:src="${program.thumbnail()}"
                             th:alt="${program.title()}" loading="lazy">
                        <div th:unless="${program.thumbnail() != null}" class="program-card__thumb-placeholder"
                             aria-hidden="true"></div>
                        <span class="program-card__status"
                              th:text="${program.recruitStatus().name() == 'OPEN'} ? '모집중' : '모집마감'"></span>
                    </div>
                    <div class="program-card__body">
                        <span class="program-card__type" th:text="${program.programType()}"></span>
                        <h3 class="program-card__title" th:text="${program.title()}"></h3>
                    </div>
                </a>
            </article>
        </div>

        <p th:if="${latestPrograms.isEmpty()}" class="empty-state">등록된 프로그램이 없습니다.</p>
    </section>

    <section id="latest-notices" class="section">
        <h2 class="section-title">공지사항</h2>

        <ul th:if="${!latestNotices.isEmpty()}" class="notice-list">
            <li th:each="notice : ${latestNotices}" class="notice-list__item">
                <a th:href="@{/boards/{id}(id=${notice.id()})}" class="notice-list__link">
                    <span class="notice-list__title" th:text="${notice.title()}"></span>
                    <time class="notice-list__date" th:datetime="${notice.createdAt()}"
                          th:text="${#temporals.format(notice.createdAt(), 'yyyy.MM.dd')}"></time>
                </a>
            </li>
        </ul>

        <p th:if="${latestNotices.isEmpty()}" class="empty-state">등록된 공지사항이 없습니다.</p>

        <a th:href="@{/boards(boardType='NOTICE')}" class="section__more">전체보기</a>
    </section>

    <section id="latest-gallery" class="section">
        <h2 class="section-title">갤러리</h2>

        <ul th:if="${!latestGallery.isEmpty()}" class="gallery-grid">
            <li th:each="gallery : ${latestGallery}" class="gallery-card">
                <a th:href="@{/boards/{id}(id=${gallery.id()})}" class="gallery-card__link">
                    <div class="gallery-card__thumb">
                        <img th:if="${gallery.thumbnail() != null}" th:src="${gallery.thumbnail()}"
                             th:alt="${gallery.title()}" loading="lazy">
                        <div th:unless="${gallery.thumbnail() != null}" class="gallery-card__thumb-placeholder"
                             aria-hidden="true"></div>
                    </div>
                    <p class="gallery-card__title" th:text="${gallery.title()}"></p>
                </a>
            </li>
        </ul>

        <p th:if="${latestGallery.isEmpty()}" class="empty-state">등록된 갤러리가 없습니다.</p>

        <a th:href="@{/boards(boardType='GALLERY')}" class="section__more">전체보기</a>
    </section>

    <section id="program-shortcut" class="cta">
        <div class="cta__inner">
            <h2 class="cta__title">지금 프로그램을 확인해보세요</h2>
            <a href="/programs" class="btn cta__button">프로그램 살펴보기</a>
        </div>
    </section>

    <script th:src="@{/js/home/hero-carousel.js}"></script>
    <script th:src="@{/js/home/popup-modal.js}"></script>
    <script>
        HeroCarousel.bootstrap(document, window);
        PopupModal.bootstrap(document, window);
    </script>
</div>
</body>
</html>
