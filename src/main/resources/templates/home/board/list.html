<!DOCTYPE html>
<html th:replace="~{home/layout/default :: layout(~{::#board-list-content}, '게시판')}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시판</title>
</head>
<body>
<div id="board-list-content" class="container" style="margin-top: 40px;">
    <h2 class="mb-4">게시판</h2>

    <nav id="board-type-filter" class="filter-nav mb-3">
        <a th:href="@{/boards(keyword=${keyword})}" class="filter-nav__link"
           th:classappend="${boardType == null} ? ' is-active'">전체</a>
        <a th:href="@{/boards(boardType='NOTICE', keyword=${keyword})}" class="filter-nav__link"
           th:classappend="${boardType != null and boardType.name() == 'NOTICE'} ? ' is-active'">공지사항</a>
        <a th:href="@{/boards(boardType='GALLERY', keyword=${keyword})}" class="filter-nav__link"
           th:classappend="${boardType != null and boardType.name() == 'GALLERY'} ? ' is-active'">갤러리</a>
        <a th:href="@{/boards(boardType='ARCHIVE', keyword=${keyword})}" class="filter-nav__link"
           th:classappend="${boardType != null and boardType.name() == 'ARCHIVE'} ? ' is-active'">자료실</a>
        <a th:href="@{/boards(boardType='REVIEW', keyword=${keyword})}" class="filter-nav__link"
           th:classappend="${boardType != null and boardType.name() == 'REVIEW'} ? ' is-active'">강의 후기</a>
    </nav>

    <form method="get" th:action="@{/boards}" class="row g-2 mb-4">
        <input type="hidden" name="boardType" th:if="${boardType != null}" th:value="${boardType}">
        <div class="col-auto">
            <input type="text" name="keyword" class="form-control" placeholder="검색어" th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">검색</button>
        </div>
    </form>

    <ul id="board-list" class="list-group mb-4">
        <li class="list-group-item" th:each="board : ${boards.content}">
            <a th:href="@{/boards/{id}(id=${board.id()})}" class="board-list__link">
                <span class="board-list__row">
                    <span class="badge bg-secondary board-list__type" th:text="${board.boardType()}"></span>
                    <span class="board-list__title" th:text="${board.title()}"></span>
                    <span class="board-list__views" th:text="'조회 ' + ${board.viewCount()}"></span>
                </span>
                <time class="board-list__date" th:datetime="${board.createdAt()}"
                      th:text="${#temporals.format(board.createdAt(), 'yyyy-MM-dd HH:mm')}"></time>
            </a>
        </li>
        <li class="list-group-item text-muted" th:if="${boards.content.isEmpty()}">등록된 게시글이 없습니다.</li>
    </ul>

    <nav th:replace="~{home/fragments/pagination :: pagination(
            '/boards', ${boards.page}, ${boards.totalPages}, ${boards.size}, ${boardType}, null, ${keyword})}"></nav>
</div>
</body>
</html>
