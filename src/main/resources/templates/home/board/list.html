<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="margin-top: 40px;">
    <h2 class="mb-4">게시판</h2>

    <nav id="board-type-filter" class="mb-3">
        <a th:href="@{/boards(keyword=${keyword})}"
           th:text="${boardType == null} ? '[전체]' : '전체'"></a>
        <a th:href="@{/boards(boardType='NOTICE', keyword=${keyword})}"
           th:text="${boardType != null and boardType.name() == 'NOTICE'} ? '[공지사항]' : '공지사항'"></a>
        <a th:href="@{/boards(boardType='GALLERY', keyword=${keyword})}"
           th:text="${boardType != null and boardType.name() == 'GALLERY'} ? '[갤러리]' : '갤러리'"></a>
        <a th:href="@{/boards(boardType='ARCHIVE', keyword=${keyword})}"
           th:text="${boardType != null and boardType.name() == 'ARCHIVE'} ? '[자료실]' : '자료실'"></a>
    </nav>

    <form method="get" th:action="@{/boards}" class="row g-2 mb-4">
        <input type="hidden" name="boardType" th:if="${boardType != null}" th:value="${boardType}">
        <div class="col-auto">
            <input type="text" name="keyword" class="form-control" placeholder="검색어" th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">검색</button>
        </div>
    </form>

    <ul id="board-list" class="list-group mb-4">
        <li class="list-group-item" th:each="board : ${boards.content}">
            <a th:href="@{/boards/{id}(id=${board.id()})}" th:text="${board.title()}"></a>
            <span class="badge bg-secondary" th:text="${board.boardType()}"></span>
            <span class="text-muted small" th:text="'조회 ' + ${board.viewCount()}"></span>
        </li>
        <li class="list-group-item text-muted" th:if="${boards.content.isEmpty()}">등록된 게시글이 없습니다.</li>
    </ul>

    <nav id="pagination">
        <a id="prev-page" th:if="${boards.page > 0}"
           th:href="@{/boards(page=${boards.page - 1}, size=${boards.size}, boardType=${boardType}, keyword=${keyword})}">이전</a>
        <a id="next-page" th:if="${!boards.last}"
           th:href="@{/boards(page=${boards.page + 1}, size=${boards.size}, boardType=${boardType}, keyword=${keyword})}">다음</a>
    </nav>
</div>
</body>
</html>
