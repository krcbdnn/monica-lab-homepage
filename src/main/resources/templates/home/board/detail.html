<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.title()}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="margin-top: 40px;">
    <div class="mb-2">
        <span class="badge bg-secondary" th:text="${board.boardType()}"></span>
        <span class="text-muted small" th:text="'조회 ' + ${board.viewCount()}"></span>
    </div>

    <h2 th:text="${board.title()}"></h2>

    <img th:if="${board.thumbnail() != null}" th:src="${board.thumbnail()}" th:alt="${board.title()}"
         class="img-fluid mb-3" loading="lazy">

    <div th:if="${board.content() != null}" th:utext="${board.content()}"></div>
    <p th:unless="${board.content() != null}" class="text-muted">등록된 내용이 없습니다.</p>

    <div th:if="${board.attachment() != null}" class="mt-3">
        <a id="attachment-link" th:href="${board.attachment()}" target="_blank">첨부파일 다운로드</a>
    </div>

    <a th:href="@{/boards}" class="btn btn-secondary mt-3">목록으로</a>
</div>
</body>
</html>
