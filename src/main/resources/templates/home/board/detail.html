<!DOCTYPE html>
<html th:replace="~{home/layout/default :: layout(~{::#board-detail-content}, ${board.title()})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${board.title()}"></title>
</head>
<body>
<div id="board-detail-content" class="container" style="margin-top: 40px;">
    <div class="mb-2">
        <span class="badge bg-secondary" th:text="${board.boardType()}"></span>
    </div>

    <h2 th:text="${board.title()}"></h2>

    <img th:if="${board.thumbnail() != null}" th:src="${board.thumbnail()}" th:alt="${board.title()}"
         class="img-fluid mb-3" loading="lazy">

    <div th:if="${board.content() != null}" th:utext="${renderedContent}"></div>
    <p th:unless="${board.content() != null}" class="text-muted">등록된 내용이 없습니다.</p>

    <div th:if="${board.attachment() != null}" class="mt-3">
        <a id="attachment-link" th:href="${board.attachment()}" target="_blank" rel="noopener noreferrer">첨부파일 다운로드</a>
    </div>

    <a th:href="@{/boards}" class="btn btn-secondary mt-3">목록으로</a>
</div>
</body>
</html>
