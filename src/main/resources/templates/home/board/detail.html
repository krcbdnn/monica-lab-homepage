<!DOCTYPE html>
<html th:replace="~{home/layout/default :: layout(~{::#board-detail-content}, ${board.title()})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${board.title()}"></title>
</head>
<body>
<div id="board-detail-content" class="container" style="margin-top: 40px;">
    <div class="mb-2">
        <span class="badge bg-secondary" th:text="${board.boardType()}"></span>
    </div>

    <h2 th:text="${board.title()}"></h2>

    <img th:if="${board.thumbnail() != null}" th:src="${board.thumbnail()}" th:alt="${board.title()}"
         class="img-fluid mb-3" loading="lazy">

    <div class="ckeditor-content" th:if="${board.content() != null}" th:utext="${renderedContent}"></div>
    <p th:unless="${board.content() != null}" class="text-muted">등록된 내용이 없습니다.</p>

    <div th:if="${board.attachment() != null}" class="mt-3">
        <a id="attachment-link" th:href="${board.attachment()}" target="_blank" rel="noopener noreferrer">첨부파일 다운로드</a>
    </div>

    <!-- P13-T28: boardType/keyword/page 셋 다 없으면(파라미터 없이 /boards/{id}를 직접 연 경우)
         기존과 동일하게 순수 /boards로 복귀한다. Thymeleaf @{}는 null 값을 파라미터 자체 생략이
         아니라 빈 값(key=)으로 렌더링하므로(실측 확인, pagination.html 기존 주석과 동일한 동작),
         "파라미터가 아예 없는 /boards"를 보장하려면 이렇게 명시적으로 분기해야 한다. 셋 중 일부만
         있는 경우(예: boardType만 있고 keyword/page는 없음)는 기존 필터 nav와 동일하게 빈 값
         파라미터가 함께 렌더링되어도 안전하다(그 값들은 /boards가 이미 null/빈 값으로 처리한다).
         programType(Task C)도 동일 원칙으로 판단 조건에 포함한다. -->
    <a th:href="${boardType == null and programType == null and keyword == null and page == null} ? @{/boards}
                : @{/boards(boardType=${boardType}, programType=${programType}, keyword=${keyword}, page=${page})}"
       class="btn btn-secondary mt-3">목록으로</a>
</div>
</body>
</html>
