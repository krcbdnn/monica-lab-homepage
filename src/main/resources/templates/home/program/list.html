<!DOCTYPE html>
<html th:replace="~{home/layout/default :: layout(~{::#program-list-content}, '프로그램')}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>프로그램</title>
</head>
<body>
<div id="program-list-content" class="container" style="margin-top: 40px;">
    <h2 class="mb-4">프로그램</h2>

    <nav id="program-type-filter" class="mb-3">
        <a th:href="@{/programs(keyword=${keyword})}"
           th:text="${programType == null} ? '[전체]' : '전체'"></a>
        <a th:href="@{/programs(programType='COURSE', keyword=${keyword})}"
           th:text="${programType != null and programType.name() == 'COURSE'} ? '[수강]' : '수강'"></a>
        <a th:href="@{/programs(programType='SPECIAL', keyword=${keyword})}"
           th:text="${programType != null and programType.name() == 'SPECIAL'} ? '[특강]' : '특강'"></a>
    </nav>

    <form method="get" th:action="@{/programs}" class="row g-2 mb-4">
        <input type="hidden" name="programType" th:if="${programType != null}" th:value="${programType}">
        <div class="col-auto">
            <input type="text" name="keyword" class="form-control" placeholder="검색어" th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">검색</button>
        </div>
    </form>

    <ul id="program-list" class="list-group mb-4">
        <li class="list-group-item" th:each="program : ${programs.content}">
            <a th:href="@{/programs/{id}(id=${program.id()})}" class="program-list__link">
                <span class="program-list__thumb">
                    <img th:unless="${#strings.isEmpty(#strings.trim(program.thumbnail()))}"
                         th:src="${program.thumbnail()}" th:alt="${program.title()}" loading="lazy">
                    <span th:if="${#strings.isEmpty(#strings.trim(program.thumbnail()))}"
                          class="program-list__thumb-placeholder" aria-hidden="true"></span>
                </span>
                <span class="program-list__body">
                    <span class="program-list__title" th:text="${program.title()}"></span>
                    <span class="program-list__meta">
                        <span class="badge bg-secondary" th:text="${program.programType()}"></span>
                        <span class="badge bg-info" th:text="${program.recruitStatus()}"></span>
                    </span>
                </span>
            </a>
        </li>
        <li class="list-group-item text-muted" th:if="${programs.content.isEmpty()}">등록된 프로그램이 없습니다.</li>
    </ul>

    <nav id="pagination">
        <a id="prev-page" th:if="${programs.page > 0}"
           th:href="@{/programs(page=${programs.page - 1}, size=${programs.size}, programType=${programType}, keyword=${keyword})}">이전</a>
        <a id="next-page" th:if="${!programs.last}"
           th:href="@{/programs(page=${programs.page + 1}, size=${programs.size}, programType=${programType}, keyword=${keyword})}">다음</a>
    </nav>
</div>
</body>
</html>
