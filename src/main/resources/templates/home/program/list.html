<!DOCTYPE html>
<html th:replace="~{home/layout/default :: layout(~{::#program-list-content}, '프로그램')}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>프로그램</title>
</head>
<body>
<div id="program-list-content" class="container">
    <h2 class="mb-4">프로그램</h2>

    <nav id="program-type-filter" class="filter-nav mb-3">
        <a th:href="@{/programs(keyword=${keyword})}" class="filter-nav__link"
           th:classappend="${programType == null} ? ' is-active'">전체</a>
        <a th:href="@{/programs(programType='COURSE', keyword=${keyword})}" class="filter-nav__link"
           th:classappend="${programType != null and programType.name() == 'COURSE'} ? ' is-active'">수강</a>
        <a th:href="@{/programs(programType='SPECIAL', keyword=${keyword})}" class="filter-nav__link"
           th:classappend="${programType != null and programType.name() == 'SPECIAL'} ? ' is-active'">특강</a>
    </nav>

    <form method="get" th:action="@{/programs}" class="row g-2 mb-4">
        <input type="hidden" name="programType" th:if="${programType != null}" th:value="${programType}">
        <div class="col-auto">
            <input type="text" name="keyword" class="form-control" placeholder="검색어" th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">검색</button>
        </div>
    </form>

    <ul id="program-list" class="list-group mb-4">
        <li class="list-group-item" th:each="program : ${programs.content}">
            <a th:href="@{/programs/{id}(id=${program.id()})}" class="program-list__link">
                <span class="program-list__thumb">
                    <img th:unless="${#strings.isEmpty(#strings.trim(program.thumbnail()))}"
                         th:src="${program.thumbnail()}" th:alt="${program.title()}" loading="lazy">
                    <span th:if="${#strings.isEmpty(#strings.trim(program.thumbnail()))}"
                          class="program-list__thumb-placeholder" aria-hidden="true"></span>
                </span>
                <span class="program-list__body">
                    <span class="program-list__title" th:text="${program.title()}"></span>
                    <!-- P14-T4A: raw enum(COURSE/SPECIAL, OPEN/CLOSED)을 공개 화면에 그대로 노출하지 않고
                         한글 표시명으로 매핑한다. domain enum/DB/API 값은 무변경(presentation layer에서만
                         처리) - Home(#latest-programs)의 recruitStatus 표시(P13-T17)와 동일한 삼항 패턴을
                         재사용한다. ProgramType/RecruitStatus는 각각 COURSE/SPECIAL, OPEN/CLOSED 두 값만
                         존재하는 닫힌 enum이라(구현 전 재확인) 이 두 값 매핑만으로 충분하다. -->
                    <span class="program-list__meta">
                        <span class="badge program-list__type-badge"
                              th:text="${program.programType().name() == 'COURSE'} ? '수강' : '특강'"></span>
                        <span class="badge program-list__status-badge"
                              th:classappend="${program.recruitStatus().name() == 'OPEN'} ? ' is-open'"
                              th:text="${program.recruitStatus().name() == 'OPEN'} ? '모집중' : '모집마감'"></span>
                    </span>
                </span>
            </a>
        </li>
        <li class="list-group-item text-muted" th:if="${programs.content.isEmpty()}">등록된 프로그램이 없습니다.</li>
    </ul>

    <nav th:replace="~{home/fragments/pagination :: pagination(
            '/programs', ${programs.page}, ${programs.totalPages}, ${programs.size}, null, ${programType}, ${keyword})}"></nav>
</div>
</body>
</html>
