<!DOCTYPE html>
<html th:replace="~{home/layout/default :: layout(~{::#program-detail-content}, ${program.title()})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${program.title()}"></title>
</head>
<body>
<div id="program-detail-content" class="container" style="margin-top: 40px;">
    <div class="mb-2">
        <span class="badge bg-secondary" th:text="${program.programType()}"></span>
        <span class="badge bg-info" th:text="${program.recruitStatus()}"></span>
    </div>

    <h2 th:text="${program.title()}"></h2>

    <!-- P13-T41: 대표 이미지(thumbnail)는 목록/홈/HomePinnedContent 카드 전용 메타데이터다.
         상세 본문의 실제 이미지는 CKEditor content가 표현하므로 여기서 별도로 자동 출력하지 않는다
         (thumbnail 필드/데이터는 그대로 유지 - 목록/홈/HomePinnedContent에서 계속 사용됨). -->
    <div class="ckeditor-content" th:if="${program.content() != null}" th:utext="${renderedContent}"></div>
    <p th:unless="${program.content() != null}" class="text-muted">등록된 내용이 없습니다.</p>

    <div th:if="${program.attachment() != null}" class="mt-3">
        <a th:href="${program.attachment()}" target="_blank" rel="noopener noreferrer">첨부파일 다운로드</a>
    </div>

    <div class="mt-4">
        <a id="apply-link" th:if="${program.googleFormUrl() != null}" th:href="${program.googleFormUrl()}"
           target="_blank" rel="noopener noreferrer" class="btn btn-primary">신청하기</a>
    </div>

    <a th:href="@{/programs}" class="btn btn-secondary mt-3">목록으로</a>
</div>
</body>
</html>
