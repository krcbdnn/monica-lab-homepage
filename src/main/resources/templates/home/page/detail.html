<!DOCTYPE html>
<html th:replace="~{home/layout/default :: layout(~{::#page-detail-content}, ${page.title()})}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${page.title()}"></title>
</head>
<body>
<div id="page-detail-content" class="container">
    <h1 class="detail-title" th:text="${page.title()}"></h1>
    <div class="ckeditor-content" th:if="${page.content() != null}" th:utext="${renderedContent}"></div>
    <p th:unless="${page.content() != null}" class="text-muted">등록된 내용이 없습니다.</p>
</div>
</body>
</html>
