<!DOCTYPE html>
<html th:fragment="layout(content, pageTitle)" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle != null} ? ${pageTitle} + ' - 모니카영어교육연구소' : '모니카영어교육연구소'">모니카영어교육연구소</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/home.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{home/layout/header :: header}"></div>
<main id="site-main">
    <th:block th:replace="${content}"></th:block>
</main>
<div th:replace="~{home/layout/footer :: footer}"></div>
<script th:src="@{/js/home/nav-toggle.js}"></script>
</body>
</html>
