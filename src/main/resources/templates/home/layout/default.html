<!DOCTYPE html>
<html th:fragment="layout(content, pageTitle)" th:attr="data-theme=${siteTheme.accentPreset}" lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle != null} ? ${pageTitle} + ' - 모니카영어교육연구소' : '모니카영어교육연구소'">모니카영어교육연구소</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- P14-T1: Pretendard Variable(OFL). jsDelivr, 버전 고정(v1.3.9), dynamic subset, font-display: swap.
         로딩 실패 시 home.css의 --font-sans fallback(시스템 한글 sans)으로 대체된다. -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link th:href="@{/css/home.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{home/layout/header :: header}"></div>
<main id="site-main">
    <th:block th:replace="${content}"></th:block>
</main>
<div th:replace="~{home/layout/footer :: footer}"></div>
<script th:src="@{/js/home/nav-toggle.js}"></script>
<script th:src="@{/js/home/nav-submenu.js}"></script>
</body>
</html>
