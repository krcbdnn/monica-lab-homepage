spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

app:
  upload:
    root: ${UPLOAD_ROOT:/app/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
