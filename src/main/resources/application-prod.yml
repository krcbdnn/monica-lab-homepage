spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: native
  tomcat:
    use-relative-redirects: true
  servlet:
    session:
      cookie:
        same-site: lax

app:
  upload:
    root: ${UPLOAD_ROOT:/app/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
