spring:
  application:
    name: monica-lab-homepage

  profiles:
    default: local

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    web:
      pageable:
        max-page-size: 100
        one-indexed-parameters: false